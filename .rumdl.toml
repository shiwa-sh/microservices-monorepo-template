# Shared Markdown ruleset + runner config for CI (`mise run lint:md` / `format:md`),
# lefthook, and any editor with the rumdl LSP. rumdl is the single source of truth
# for Markdown lint *and* format — do NOT use the IDE's Ctrl+Alt+L on .md files.
# Rules: https://github.com/rvben/rumdl

[global]
# Prose is not hard-wrapped: one line per paragraph, list item, or table row, so a
# reflow never shows up as a diff. A column limit would fight that (ADR-0001).
disable = ["MD013"]
exclude = [
  "node_modules",
  ".next",
  "dist",
  "build",
  ".github/**",
  "libs/ts/sdks/**",
  "apps/admin/_generated/**",
  "**/CHANGELOG.md",
]

[MD004]
style = "dash"

[MD007]
indent = 2
style = "fixed"

# ADRs reuse section names (Context, Decision, Consequences) under different parents.
[MD024]
siblings-only = true

[MD029]
style = "ordered"

# Tables are compact, never column-padded: one space inside each pipe and a bare
# `---` delimiter. Padding makes every cell edit reflow the whole table, and the
# rule ships disabled upstream, which is why alignment had drifted (ADR-0001).
[MD060]
enabled = true
style = "compact"
