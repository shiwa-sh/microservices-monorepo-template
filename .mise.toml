[tools]
# Languages & runtimes
go = "1.26.4"
bun = "1.3.14"
# node is NOT pinned here — it is an island tool (ADR-0100/ADR-0601). Its consumers
# are test/e2e/ (the Playwright runner) and apps/admin (Lowdefy's optional local dev
# loop), so each pins it in its own config against NODE_VERSION below. See [env].

# Database tooling
dbmate = "2.33.0"
sqlc = "1.31.1"
"github:quarylabs/sqruff" = "0.38.0"

# API contracts & codegen
"go:github.com/ogen-go/ogen/cmd/ogen" = "1.22.0"
vacuum = "0.29.2"

# Frontend toolchain
biome = "2.5.0"

# Kubernetes & infra
helm = "4.2.2"
kubectl = "1.36.2"
# CLI pinned to the server appVersion (infra/helm/platform/argocd). cluster:full
# drives convergence with `argocd app wait --core` (talks to the Application CRDs
# via kubeconfig, no argocd-server login).
argocd = "3.4.4"
cilium-cli = "0.19.4"
kustomize = "5.8.1"
terraform = "1.15.6"
k3d = "5.9.0"
# ansible is NOT pinned here — it is an operator-only island, scoped to
# infra/ansible/.mise.toml so the prod bootstrap tool (and the Python it drags in)
# never installs for a dev running lint/test/cluster:full. See that file.

# Secrets
age = "1.3.1"
sops = "3.13.1"

# JSON wrangling for runtime glue scripts (ops:grant). Static policy checks use
# Go tools/ instead; this is the one reproducible binary for shell-side JSON.
jq = "1.8.1"
# YAML counterpart of jq, for the prod-promotion glue (promote-on-release writes
# image digests into the prod values files — ADR-0103). Same rationale as jq.
"aqua:mikefarah/yq" = "4.47.1"

# Authorization (OpenFGA model validation + ops-grant tuple writes)
"github:openfga/cli" = "0.7.13"

# Repo hygiene
lefthook = "2.1.9"
cocogitto = "7.0.0"
act = "0.2.89"
golangci-lint = "2.12.2"
rumdl = "0.2.18"
# Shell scripts are first-class here (all glue is bash, ADR-0101) — shellcheck
# lints, shfmt (mvdan/sh) formats. Wired into lint:shell / format:shell and the
# pre-commit hook so a scripts/ edit gets the same gate as Go/TS/Markdown.
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"

[env]
GOFLAGS = "-mod=readonly"
CGO_ENABLED = "0"
# Single source for the island Node version. Islands pin `node = "{{env.NODE_VERSION}}"`
# in their own config rather than repeating the number — root [env] resolves into a
# nested config's [tools], so there is exactly one place to bump.
NODE_VERSION = "22"

# Task naming: `group:member`, group = the axis you list/run together (ADR-0101).
# `activity:target` for fan-out families with an umbrella (gen, lint, format);
# `resource:operation` for lifecycles (cluster, service, db).

# ── Setup ─────────────────────────────────────────────────────────────────────
[tasks.setup]
run = "lefthook install"

# ── Local cluster & inner loop ────────────────────────────────────────────────
[tasks."cluster:ensure"]
# Ensure the single local k3d cluster exists and is running (create-or-start).
run = "bash scripts/cluster-ensure.sh"

[tasks."cluster:cilium"]
# Install Cilium as the CNI (ADR-0200). Needs the cluster first. Internal plumbing
# (a dependency node for cluster:base), not a command you run directly — hence hidden.
hide = true
depends = ["cluster:ensure"]
run = "bash scripts/cilium-install.sh"

[tasks."cluster:base"]
# The local floor (ADR-0205, ADR-0600): Traefik + cert-manager + Postgres + Kratos
# + Oathkeeper, plus the host edge glue and the seeded test identities. Everything
# above it is opt-in and declared by the service that needs it — there are no named
# profiles. You rarely run this by hand: a service's own tasks depend on it.
run = "bash scripts/cluster-base.sh"

[tasks."cluster:full"]
# Full local platform via ArgoCD (ADR-0201, ADR-0205): syncs committed master.
# Ordering/waits/secrets are Argo's job (sync-waves). See docs/dev-loop.md.
run = "bash scripts/cluster-full.sh"

# ── Opt-in dependency components ──────────────────────────────────────────────
# One task per label slice of infra/local/deps.yaml. Services declare these in
# their own .mise.toml; mise dedupes the shared cluster:base edge, so a service
# needing three components still brings the floor up once. Every one of them
# fast-exits when already Ready — see the guard in scripts/dep-apply.sh, which is
# what keeps the graph cheap to re-enter.
[tasks."dep:postgres"]
# In the floor already (Kratos needs a store); declared anyway so a service's
# dependencies read as its own, not as something base happens to provide.
depends = ["cluster:base"]
run = "bash scripts/dep-apply.sh postgres"

[tasks."dep:temporal"]
depends = ["cluster:base"]
run = "bash scripts/dep-apply.sh temporal"

[tasks."dep:openfga"]
depends = ["cluster:base"]
run = "bash scripts/dep-apply.sh openfga"

[tasks."dep:db-secrets"]
# The per-service DB secrets the service chart mounts via envFrom. Needed by the
# IN-CLUSTER path only: a natively-run service reads .env instead.
depends = ["cluster:base"]
run = "bash scripts/dep-apply.sh db-secrets"

# ── Sibling services ──────────────────────────────────────────────────────────
# `dep:*` covers the infrastructure a service needs; these cover the OTHER SERVICES
# it calls. Same shape, same guard, same reason: the service knows its own callees
# and a named profile never can (ADR-0205, ADR-0600).
#
# Each one makes the callee answer on its registered local port
# (scripts/lib/ports.sh), which is what lets the caller's .env.example ship a
# working CATALOG_URL instead of a commented-out suggestion. Deploying is the
# DEFAULT because the usual case is working on the caller, where the callees should
# be opaque; run a callee natively yourself and svc:* sees the port answered and
# stays out of the way.
[tasks."svc:authz"]
depends = ["cluster:base"]
run = "bash scripts/svc-apply.sh authz"

[tasks."svc:catalog"]
depends = ["cluster:base"]
run = "bash scripts/svc-apply.sh catalog"

[tasks."svc:orders"]
depends = ["cluster:base"]
run = "bash scripts/svc-apply.sh orders"

[tasks."svc:orgs"]
depends = ["cluster:base"]
run = "bash scripts/svc-apply.sh orgs"

[tasks."svc:payment"]
depends = ["cluster:base"]
run = "bash scripts/svc-apply.sh payment"

[tasks."cluster:edge-glue"]
# Re-stamp the host-only frontend edge glue: the last-resort catch-all `/` → host
# `next dev` :3000 and the docker-bridge EndpointSlice behind it. Per-machine state
# that cannot be GitOps-managed (the bridge IP is discovered at runtime and moves
# across restarts), so a stop/start or reboot loses it → Traefik 404 at /.
#
# Internal plumbing: cluster:ensure (start), cluster:heal (reboot) and cluster:base
# all run it automatically. Hidden for the same reason cluster:cilium is — invoke it
# by hand only to self-heal a 404/502 at / without a full restart. To route a
# NATIVE service (not the frontend) through the edge, use service:dev instead.
hide = true
run = "bash scripts/cluster-edge-glue.sh"

[tasks."cluster:stop"]
# Stops the cluster but KEEPS it (image cache + volumes survive) so the next
# bring-up resumes without re-pulling.
run = "bash scripts/cluster-stop.sh"

[tasks."cluster:delete"]
# Deletes the cluster and wipes its image cache (reclaims disk, clean rebuild).
run = "k3d cluster delete ${CLUSTER:-platform}"

[tasks."cluster:heal"]
# Recover a cluster wedged after a host reboot: Docker's raw restart of the node
# skips k3d's host.k3d.internal injection, so pulls fail and Cilium/pods hang. This
# stop+starts to re-inject it. Run it when everything is stuck ContainerCreating
# after a reboot.
run = "bash scripts/cluster-heal.sh"

[tasks."cluster:unwedge"]
# OPT-IN, proxied networks only: host-pull + k3d-import any image the node's
# containerd is failing to pull through an HTTP proxy (ImagePullBackOff), then
# restart the stuck pods. Not part of any bring-up — clean networks never need it.
run = "bash scripts/cluster-unwedge-images.sh"

[tasks."cluster:preload"]
# OPT-IN, proxied networks only: PROACTIVELY host-pull + k3d-import the
# bootstrap-critical images (Cilium, ArgoCD) before cluster:full's imperative
# `helm --wait` head can wedge on them — the gap cluster:unwedge (reactive, pods
# only) cannot cover. Image list is derived from the charts, not hardcoded.
# `PRELOAD_ALL=1` also warms the Argo-synced platform apps. cluster:full runs this
# automatically only when CLUSTER_PRELOAD=1.
run = "bash scripts/cluster-preload-images.sh"

[tasks."argo:pause"]
# Open a live-patch window: ArgoCD selfHeal reverts any direct edit to a synced
# resource within seconds, so scale the application-controller to 0 before
# kubectl-patching / helm-upgrading the cluster by hand (e.g. validating a values
# or NetworkPolicy fix before it lands on master). The cluster keeps running —
# only reconciliation stops. ALWAYS pair with argo:resume; a paused controller
# means the cluster silently stops tracking master.
run = "kubectl --context k3d-${CLUSTER:-platform} -n argocd scale statefulset/argocd-application-controller --replicas=0"

[tasks."argo:resume"]
# Close the live-patch window and hand the cluster back to GitOps. Anything patched
# live that is not committed to master is reverted on the next sync — that is the
# point: push first, then resume, or lose the change.
run = "kubectl --context k3d-${CLUSTER:-platform} -n argocd scale statefulset/argocd-application-controller --replicas=1"

[tasks."dev:forward"]
# Port-forward the inner-loop deps so a natively-run service can reach them.
# Long-running — use a separate terminal. See docs/dev-loop.md.
run = "bash scripts/dev-forward.sh"

[tasks."dev:frontend"]
# The host-run `next dev` the local edge routes `/` to (ADR-0400/0016). Long-running
# — use a separate terminal. One env var is what makes a host process behave like
# the in-cluster frontend; see docs/dev-loop.md:
#   EDGE_PUBLIC_ORIGIN  where server components fetch — the edge, not a cluster DNS
#                       name the host cannot resolve. The /api IngressRoutes match on
#                       Host(dev.localtest.me), and next.config.mjs derives the
#                       server-action CSRF allowlist from this. On the host the public
#                       and internal origins are the same, so EDGE_INTERNAL_ORIGIN is
#                       left unset and server-fetch falls back to this one.
#
# NODE_TLS_REJECT_UNAUTHORIZED is deliberately GONE. The local wildcard is now issued
# by a real local CA, so the script extracts that CA and trusts exactly it — the same
# mechanism the in-cluster image uses, with nothing unverified on either path.
env = { EDGE_PUBLIC_ORIGIN = "https://dev.localtest.me:8443" }
run = "bash scripts/dev-frontend.sh"

[tasks."db:migrate"]
run = "bash scripts/db-migrate.sh"

[tasks."auth:seed"]
# Seed the committed deterministic test identities (ADR-0601) into a running Kratos.
# cluster:base does this for you; run it alone after a Kratos reinstall.
run = "bash scripts/identity-seed.sh"

# ── Code generation ───────────────────────────────────────────────────────────
[tasks.gen]
# No gateway codegen — the edge (Traefik + Oathkeeper) does not consume the
# OpenAPI spec (ADR-0305). Generators: ogen + openapi-typescript (SDKs), sqlc
# (queries), and the devportal spec projections rendered by Scalar (ADR-0303).
depends = ["gen:openapi", "gen:openapi-public", "gen:sqlc", "gen:admin", "gen:adr-rules"]

[tasks."gen:adr-rules"]
# Two documents are views over the ADR set's Rules sections: the rules index and the
# security baseline (ADR-0203). Both were hand-maintained copies of facts owned by the
# ADRs, so both are generated and drift-checked like any other generated artefact.
run = "go run ./tools/adr-rules"

[tasks."gen:openapi"]
run = "bash scripts/gen-openapi.sh"

[tasks."gen:admin"]
# Scaffold the Lowdefy admin pages from the OpenAPI specs (ADR-0401). Depends on
# gen:openapi so it reads specs that have already passed a generation cycle.
depends = ["gen:openapi"]
run = "bash scripts/gen-admin.sh"

[tasks."gen:openapi-public"]
# Filtered OpenAPI projections for the Scalar developer portals (ADR-0303/0009/0014).
run = "bash scripts/gen-openapi-public.sh"

[tasks."gen:authz-model"]
# Regenerate infra/auth/openfga/model.json from the canonical model.fga DSL
# (ADR-0304). The seed Job posts this JSON to the OpenFGA API; lint:authz asserts
# it stays in sync with the DSL.
run = "fga model transform --file infra/auth/openfga/model.fga --output-format json | jq -S . > infra/auth/openfga/model.json"

[tasks."gen:sqlc"]
run = "bash scripts/gen-sqlc.sh"

[tasks."gen:clean"]
# Wipe generated SDKs and regenerate, pruning orphans. (sqlc untouched.)
run = """
rm -rf libs/go/sdks/* libs/ts/sdks/*
mise run gen
"""

# ── Format ────────────────────────────────────────────────────────────────────
[tasks.format]
depends = ["format:go", "format:ts", "format:md", "format:shell"]

[tasks."format:go"]
run = "golangci-lint fmt ./..."

[tasks."format:ts"]
run = "biome format --write ."

[tasks."format:md"]
# rumdl is the only Markdown formatter — never the IDE's.
run = "rumdl fmt ."

[tasks."format:shell"]
# shfmt (mvdan/sh) is the shell formatter. -i 2 matches the repo's 2-space scripts;
# no arg list = format every tracked *.sh in place.
run = "git ls-files -z '*.sh' | xargs -0 shfmt -w -i 2"

# ── Lint ──────────────────────────────────────────────────────────────────────
[tasks.lint]
depends = ["lint:go", "lint:gostyle", "lint:ts", "lint:sql", "lint:openapi", "lint:api-audience", "lint:floating-tags", "lint:md", "lint:shell", "lint:node-scope", "lint:auth-inline", "lint:authz", "lint:log-vocab", "lint:resource-governance", "lint:ports", "lint:service-contract", "lint:prose", "lint:adr-xref", "lint:readme-drift", "lint:rules-index"]

[tasks."lint:go"]
run = "golangci-lint run ./..."

[tasks."lint:gostyle"]
# Custom layout-based Go style analyzers
run = "go run ./tools/gostyle ./..."

[tasks."lint:ts"]
run = "biome ci --error-on-warnings ."

[tasks."lint:sql"]
run = "bash scripts/lint-sql.sh"

[tasks."lint:openapi"]
run = "bash scripts/lint-openapi.sh"

[tasks."lint:service-contract"]
# ADR-0205 gate: every service provides the same artifacts, because the platform
# DISCOVERS services through those artifacts. Most sharply, the ApplicationSet
# generates one Argo app per values file, so a missing values file means the service
# is absent from that environment with nothing to notice — how authz ended up
# undeployed in dev while Oathkeeper called it by DNS.
run = "bash scripts/lint-service-contract.sh"

[tasks."lint:ports"]
# Local port registry gate (ADR-0205): ports unique, every service registered, and
# each service's .mise.toml binding what the registry assigns it. A drift there
# fails at runtime as a bare connection-refused, so it is caught at lint instead.
run = "bash scripts/lint-ports.sh"

[tasks."lint:api-audience"]
# Audience↔exposure gate (ADR-0303): a spec's info.x-audience must match whether the
# service is edge-exposed (public ⇔ has an /api route). Spec-less control-plane
# services (authz) are exempt. Prevents the finding-D omission from recurring.
run = "go run ./tools/lint-api-audience"

[tasks."lint:resource-governance"]
# ADR-0204 gate: renders every chart (each service separately) and checks the
# declared resources against the guardrails in infra/helm/platform/resource-governance
# BEFORE they reach a cluster — LimitRange floors that would REJECT a pod, containers
# with no requests/memory limit and no namespace default, unsanctioned CPU limits, and
# ResourceQuota headroom. Catches the admission-time, cluster-wide failures that are
# invisible in review: a 16Mi floor here was one apply away from rejecting Cilium's
# CNI initContainer and taking the node's networking with it.
run = "go run ./tools/lint-resource-governance"

[tasks."lint:floating-tags"]
run = "bash scripts/lint-floating-tags.sh"

[tasks."image:digest"]
# Resolve a tag to the index digest a Dockerfile or values file pins to, so the
# pin is read from the registry rather than copied by hand (ADR-0101, ADR-0104).
#   mise run image:digest -- gcr.io/distroless/static-debian13:nonroot
run = "bash scripts/image-digest.sh"

[tasks."lint:prose"]
# ADR-0001's banned-constructs table, enforced. The table is deliberately grep-shaped;
# a house style that only review enforces is a house style that drifts.
run = "go run ./tools/lint-prose"

[tasks."lint:adr-xref"]
# The ADR set's internal wiring: references resolve, Related names documents that exist,
# every ADR carries a Decides line and an index row, the two adoption documents name the
# same components, every deferral has a register row, and nothing under docs/ links to
# the root README (ADR-0001).
run = "go run ./tools/lint-adr-xref"

[tasks."lint:readme-drift"]
# Principle 9 applied to the one document that is not generated. The root README
# duplicates selection guidance by design, and a duplicate with no check drifts —
# a tool the ADRs rejected kept appearing on the first page a reader sees.
run = "go run ./tools/lint-readme-drift"

[tasks."lint:rules-index"]
# Drift check for the generated rule documents. `mise run gen` writes them.
run = "go run ./tools/adr-rules -check"

[tasks."lint:md"]
run = "rumdl check ."

[tasks."lint:shell"]
# shellcheck over every tracked *.sh (ADR-0101). All glue here is bash, so it gets
# the same static analysis Go/TS do.
run = "bash scripts/lint-shell.sh"

[tasks."lint:log-vocab"]
# Human-output vocabulary gate (ADR-0001): scripts use →/✓/✗/⚠ via scripts/lib/log.sh,
# not bare WARN/ERROR/FAIL prose.
run = "bash scripts/lint-log-vocab.sh"

[tasks."lint:node-scope"]
# Node confinement guard (ADR-0100/ADR-0601): Node/npm may appear ONLY in the
# repo-root test/e2e/ workspace. Fails if a package-lock.json or node_modules leaks
# elsewhere, or if test/e2e/ is pulled into the Bun workspace.
run = "bash scripts/lint-node-scope.sh"

[tasks."lint:auth-inline"]
# Auth single-source guard (ADR-0305/0010/0029): fails if kratos/oathkeeper config
# is re-inlined into the Ory chart values instead of living in infra/auth/*, or if
# the frontend grows development-only auth code (a session bypass in proxy.ts or
# src/lib/auth/ — local UI work logs in for real via cluster:base).
run = "bash scripts/lint-auth-inline.sh"

[tasks."lint:authz"]
# Edge-auth policy gates (ADR-0304/0305/0306):
#   - OpenFGA model + assertions (fga model test) + model.json in-sync check
#   - ops dashboards authorize via remote_json → Checker, never `allow`
#   - the product /api rule enumerates resources, never a bare /api wildcard
#   - every forward-auth route strips client identity headers first (anti-spoofing)
run = """
bash scripts/validate-openfga.sh
go run ./tools/lint-authorizer infra/auth/oathkeeper/access-rules.json
go run ./tools/lint-api-wildcard infra/auth/oathkeeper/access-rules.json
bash scripts/lint-strip-headers.sh
"""

# ── Test & build ──────────────────────────────────────────────────────────────
[tasks.test]
run = "go test ./..."

[tasks.build]
run = "go build ./..."

# ── Composite gates ───────────────────────────────────────────────────────────
[tasks.pre-commit]
depends = ["format", "lint"]

[tasks.check]
depends = ["format", "lint", "test"]

# ── CI entrypoints ────────────────────────────────────────────────────────────
[tasks."ci:affected"]
run = "go run ./tools/affected"

[tasks."ci:lint"]
depends = ["lint"]

[tasks."ci:test"]
depends = ["test"]

[tasks."ci:build"]
depends = ["build"]

[tasks."ci:gen"]
# Drift check: regenerate AND reformat, then fail if anything changed.
#
# Formatting belongs here rather than in `lint` because the linters are analysers
# (golangci-lint run, biome lint, rumdl check, shellcheck) and none of them rewrite
# code — a correctly-analysed-but-misformatted file passes `mise run lint` cleanly.
# Only the formatters can tell, and they tell by rewriting, which is exactly the
# shape this drift check already handles for generated code.
#
# The single definition behind ci-drift.yml and the lefthook gen-drift hook: run it
# locally to reproduce that CI job exactly.
run = """
mise run gen
mise run format
git diff --exit-code
"""

# ── Deploy to cluster (working-tree overrides) ────────────────────────────────
[tasks."cluster:add"]
# One verb for "put this in the cluster" (ADR-0600). Resolves <name> to a service
# or a platform chart and dispatches; errors if a name is both. Dependency
# components are NOT nouns here — they are graph-internal (`dep:*`), which is what
# keeps `postgres` (a platform chart AND a deps.yaml slice) unambiguous.
#   mise run cluster:add -- orders     # a service, from the working tree
#   mise run cluster:add -- ory        # a platform chart, from the working tree
run = "bash scripts/cluster-add.sh"

[tasks."cluster:remove"]
# The counterpart. Uninstalls the release AND restores ArgoCD auto-sync, which the
# add path paused — without that, remove leaves the thing gone *and* unmanaged.
#   mise run cluster:remove -- orders
run = "bash scripts/cluster-remove.sh"

[tasks."service:deploy"]
# One-shot in-cluster deploy of a service from the working tree (no watch). Brings
# up the service's declared dependency components first. Prefer cluster:add.
#   mise run service:deploy -- <svc>
run = "bash scripts/service-deploy.sh"

[tasks."service:undeploy"]
# Prefer cluster:remove, which also restores GitOps.
#   mise run service:undeploy -- <svc>
run = "bash scripts/cluster-remove.sh"

[tasks."service:dev"]
# Run a service NATIVELY behind the real edge: stamps the per-service edge glue
# (an IngressRoute + an EndpointSlice at the docker-bridge gateway) so Traefik
# routes to the host process, then hands you the command to run.
#   mise run service:dev -- orders
run = "bash scripts/service-dev.sh"

[tasks."platform:deploy"]
# One-shot working-tree overlay of a platform chart (rare infra iteration).
#   mise run platform:deploy -- <chart>     # e.g. ory, observability, lowdefy
# For lowdefy (the admin console) this also rebuilds the baked image, since its
# YAML pages are compiled in at build time.
run = "bash scripts/platform-deploy.sh"

# ── Auth, ops & secrets ───────────────────────────────────────────────────────
[tasks."auth:token"]
# Mint a Kratos session token for local authenticated calls (needs the full tier).
#   mise run auth:token -- <email>
run = "bash scripts/auth-token.sh"

[tasks."ops:grant"]
# Operator onboarding (ADR-0304/0017): add/revoke a human's group:operator
# membership by email. Usage: mise run ops:grant -- <email> [--revoke].
run = "bash scripts/ops-grant.sh"

[tasks."secrets:age"]
# Idempotent; also writes .sops.yaml (ADR-0202).
run = "bash scripts/secrets-age.sh"

# ── End-to-end tests ──────────────────────────────────────────────────────────
# Thin delegates into the Node island. The real tasks (and the node pin) live in
# test/e2e/.mise.toml, because mise tools flow down a config tree and never up: a task
# defined here cannot see a tool pinned there. `-C` runs them in test/e2e/ and
# auto-installs node on first use, so these stay the entrypoint for humans and CI.
[tasks."e2e:install"]
run = "mise run -C test/e2e install"

[tasks.e2e]
run = "mise run -C test/e2e test"

[tasks."e2e:smoke"]
run = "mise run -C test/e2e test:smoke"

# ── Load & performance tests ──────────────────────────────────────────────────
# Thin delegates into the k6 island, same reason as the e2e ones above: the k6
# pin lives in test/perf/.mise.toml and mise tools flow down a config tree, never up.
# These are NOT part of `test`, `check` or `ci:affected` (ADR-0601) — they answer
# "what does it cost and where does it break", not "is it correct", and they need
# a running cluster:full.
[tasks.perf]
# The steady baseline: nightly + pre-release.
run = "mise run -C test/perf load"

[tasks."perf:smoke"]
# ~30s. Proves the scenarios still run; the label-gated per-PR lane.
run = "mise run -C test/perf smoke"

[tasks."perf:stress"]
# Ramp to saturation. Thresholds are expected to break — the finding is where.
run = "mise run -C test/perf stress"

[tasks."perf:soak"]
# ~30min sustained, for leak detection.
run = "mise run -C test/perf soak"

[tasks."perf:seed"]
# Bulk catalog data so the read path is measured against a realistic table.
#   mise run perf:seed -- 50000      mise run perf:seed -- --clean
run = "mise run -C test/perf seed"

# ── Maintenance ───────────────────────────────────────────────────────────────
[tasks.upgrade]
depends = ["upgrade:tools", "upgrade:js", "upgrade:go"]

[tasks."upgrade:tools"]
run = "bash scripts/upgrade-tools.sh"

[tasks."upgrade:js"]
run = "bun update --latest --recursive"

[tasks."upgrade:go"]
# GOFLAGS override: go get must write go.mod (env pins -mod=readonly).
# Scope to Go roots so go get skips node_modules (bun symlinks → "ignoring symlink" noise).
run = """
GOFLAGS= go get -u ./libs/... ./services/... ./tools/...
GOFLAGS= go mod tidy
"""

[tasks.act]
run = "act pull_request --secret-file .env -e .github/act/pull_request.json"
