# The full tier's machine config (ADR-0600, ADR-0200).
#
# Applied on top of what `talosctl cluster create` generates, and deliberately NOT
# a copy of infra/talos/patches/common.yaml: the container profile has no disk to
# install to, no installer image, and no sysctls it is allowed to set — the nodes
# share the host kernel. What it DOES share with a deployed environment is the part
# the tier exists to exercise: the CNI is absent so Cilium delivers it, kube-proxy
# is disabled so Cilium's eBPF dataplane owns Services, and KubePrism is the address
# the agent uses.
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true

  # Every node schedules. Three nodes exist here to make pod-to-pod traffic cross a
  # real network hop and to make anti-affinity and node-pinned volumes mean
  # something — not to make etcd a cluster, which the docker provisioner cannot do.
  allowSchedulingOnControlPlanes: true

  # Talos's discovery service talks to a Sidero-hosted registry. A laptop cluster
  # that phones home on every create is a network dependency in the inner path of
  # `mise run cluster:full`, and it buys nothing here.
  discovery:
    enabled: false

machine:
  kubelet:
    # The node's "image filesystem" is the DEVELOPER'S DISK. These nodes are
    # containers sharing the host filesystem, so each kubelet measures the whole
    # laptop and applies thresholds meant for a dedicated node.
    #
    # A laptop at 80% is normal and is not a node running out of room, but the
    # defaults (image GC high at 85%, eviction at 10% free) read it as one: all
    # three nodes take a `disk-pressure` taint at once, the Cilium operator cannot
    # schedule because it does not tolerate that taint, the Cilium CRDs are never
    # registered, and every agent fatals after five minutes on "Unable to find all
    # Cilium CRDs". Nothing in that chain mentions disk, which is why this is set
    # here rather than left to be rediscovered.
    #
    # `cluster-talos-ensure.sh` still refuses to start above 85%, so this raises the
    # threshold for normal laptop fullness without hiding a genuinely full disk.
    extraConfig:
      imageGCHighThresholdPercent: 95
      imageGCLowThresholdPercent: 90
      evictionHard:
        nodefs.available: 3%
        imagefs.available: 3%

  features:
    kubePrism:
      enabled: true
      port: 7445

  # The local registry, reached over PLAIN HTTP.
  #
  # Talos nodes hold no image the cluster did not pull — there is no `kind load`
  # equivalent and no host image store to share — so the full tier gets images the
  # way a deployed environment does: pushed to a registry, pulled by the kubelet
  # (ADR-0600). That registry is a container on the docker network with no TLS, and
  # without this mirror every pull fails on an https handshake against a plaintext
  # endpoint.
  registries:
    mirrors:
      registry.localhost:5000:
        endpoints:
          - http://registry.localhost:5000
      # Upstream registries, mirrored locally (ADR-0105, ADR-0600, and the Talos
      # half of docs/guide/http-proxy.md).
      #
      # This is the replacement for `kind load`. A Talos node holds no image the
      # cluster did not pull, so on a slow or restricted network every bootstrap
      # image crosses the proxy — and concurrently, which is how `TLS handshake
      # timeout` from quay.io stalls the Argo CD rollout. Measured: Cilium's images
      # got through, Argo's did not, and Traefik sat in ContainerCreating for 28
      # minutes until the mirror had it.
      #
      # Two ways to fill the mirror, and the second is better:
      #
      #   `mise run cluster:preload` pulls on the HOST, where the proxy is already
      #   configured and the pull is serial, and pushes here. Needs a derived image
      #   list, which is the part that rots.
      #
      #   zot's sync extension makes this a PULL-THROUGH cache: it fetches on first
      #   request and keeps it. Nothing has to be preloaded and no list has to be
      #   maintained. That is what infra/helm/platform/zot configures, and it is why
      #   only ONE component needs egress for images.
      #
      # Fallback to the upstream registry is DELIBERATELY left on (no
      # `skipFallback`): an image nobody cached still resolves, slowly, instead of
      # failing. The mirror is an accelerator, not an allow-list — Kyverno is the
      # allow-list (ADR-0104).
      quay.io:
        endpoints:
          - http://registry.localhost:5000
      ghcr.io:
        endpoints:
          - http://registry.localhost:5000
      registry.k8s.io:
        endpoints:
          - http://registry.localhost:5000
      docker.io:
        endpoints:
          - http://registry.localhost:5000
    config:
      registry.localhost:5000:
        tls:
          insecureSkipVerify: true
