{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}-server
  labels: {{- include "service.labels" . | nindent 4 }}
    component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: {{- include "service.selector" . | nindent 6 }}
      component: server
  template:
    metadata:
      labels: {{- include "service.selector" . | nindent 8 }}
        component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      # The registry authenticates every pull (ADR-0105) and a kubelet holds no
      # credential of its own. Node-level auth is not the alternative: containerd 2
      # ignores it once a hosts.d config path is set, and the pull then fails with
      # `no basic auth credentials` on a node whose configuration contains them.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service.fullname" . }}
      # ADR-0204 eviction order. Declared explicitly (not inherited) because the
      # PriorityClass globalDefault is platform-critical — product workloads must sit
      # BELOW the platform they depend on, so this is the one place that opts down.
      priorityClassName: {{ .Values.priorityClassName }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        # dbmate runs from the service image itself — it carries the static dbmate
        # binary and the baked /db/migrations (see the service Dockerfile). `migrate`
        # (not `up`) skips DB creation: CNPG provisions the databases (ADR-0300).
        - name: migrations
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/dbmate", "--no-dump-schema", "--migrations-dir", "/db/migrations", "migrate"]
          envFrom:
            {{- range .Values.secrets.envFrom }}
            - secretRef: { name: {{ . }} }
            {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http,  containerPort: {{ .Values.server.port }} }
            {{- if .Values.server.adminPort }}
            - { name: admin, containerPort: {{ .Values.server.adminPort }} }
            {{- end }}
          env:
            {{- include "service.otelEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          envFrom:
            {{- range .Values.secrets.envFrom }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          # readiness = deep (deps pinged) → gates Service traffic without restarting;
          # liveness = shallow (process alive) → never dep-aware (ADR-0500).
          #
          # Overridable because not every workload this chart deploys is a Go service
          # with an admin port: the frontend is a Next standalone server with one
          # port and no /readyz. The DEFAULTS are the Go contract, so overriding is a
          # deliberate act by the one values file that needs to (ADR-0205 — same
          # chart everywhere, differences expressed as values, never as a fork).
          readinessProbe: {{- toYaml .Values.server.probes.readiness | nindent 12 }}
          livenessProbe: {{- toYaml .Values.server.probes.liveness | nindent 12 }}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- range .Values.secrets.files }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- range .Values.secrets.files }}
        - name: {{ .name }}
          secret: { secretName: {{ .name }} }
        {{- end }}
{{- end }}
