apiVersion: apps/v1
kind: Deployment
metadata:
  name: lowdefy
  namespace: platform
  labels: { app.kubernetes.io/name: lowdefy }
spec:
  replicas: {{ .Values.lowdefy.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: lowdefy } }
  template:
    metadata: { labels: { app.kubernetes.io/name: lowdefy } }
    spec:
      # `restricted` (ADR-0200). Unlike every other chart here the image is ours
      # (apps/admin/Dockerfile), which is why the UID is named: the Dockerfile's
      # `USER node` and this 1000 are the same decision written on both sides, and
      # a mismatch would leave the pod unable to write .lowdefy/ at startup.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: lowdefy
          image: {{ include "lowdefy.image" . | quote }}
          imagePullPolicy: {{ .Values.lowdefy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports: [{ name: http, containerPort: 3000 }]
          env:
            {{- range $k, $v := .Values.lowdefy.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe: { tcpSocket: { port: http } }
          resources: {{- toYaml .Values.lowdefy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: lowdefy, namespace: platform }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: lowdefy }
  ports: [{ name: http, port: 80, targetPort: http }]
