# Ory umbrella chart values (ADR-0305, ADR-0304).
#
# The auth config is NOT inlined here — it lives once in the canonical tree under
# infra/auth/ and is injected at install time (Phase 0.4 of the auth plan):
#   - infra/auth/kratos/values.yaml            → `-f` overlay (kratos.config map)
#   - infra/auth/oathkeeper/values.yaml        → `-f` overlay (oathkeeper.config map)
#   - infra/auth/kratos/identity-schemas/user.v1.json
#                                              → --set-file kratos.kratos.identitySchemas."user.v1.json"
#   - infra/auth/oathkeeper/access-rules.json  → --set-file oathkeeper.oathkeeper.accessRules
# scripts/cluster.sh wires the local path; the platform ApplicationSet wires
# the deployed path (valueFiles + fileParameters). A CI lint (mise run
# lint:auth-inline) fails if any of these are re-inlined into this file.

oathkeeper:
  enabled: true
  deployment:
    # ADR-0204. Measured 2026-07-26 under the ADR-0601 read-path load: 66Mi working
    # set but 192m CPU — the BUSIEST component on the /api path, ahead of catalog
    # itself, because every request pays a forward-auth hop here (ADR-0305). Bursty
    # by nature and therefore deliberately un-CPU-limited: throttling this throttles
    # the whole edge.
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { memory: "384Mi" }
    extraEnv:
      - name: SQA_OPT_OUT
        value: "true"

# No phone-home: Ory's SQA telemetry dials sqa.ory.sh on 443, which the
# default-deny egress correctly drops — pure PolicyDropsDetected noise. Every
# Ory binary phones home independently, so EACH deployment needs the opt-out
# (kratos-only was not enough — oathkeeper kept tripping PolicyDropsDetected).
# This is deployment wiring, not auth config, so it lives here and not in
# infra/auth/.
kratos:
  # Migrations run as an init container before the service container, in every
  # environment (docs/guide/database-migrations.md). Setting this per-overlay is
  # how a deployed environment ends up with a Kratos that starts against an
  # unmigrated database and reports `Unable to locate the table` — a message that
  # names neither the migration nor the setting that would have run it.
  kratos:
    automigration:
      enabled: true
      type: initContainer
  deployment:
    # ADR-0204. Measured: 121Mi working set, 89m CPU. Explicit because 121Mi is
    # nearly double the namespace LimitRange's 64Mi default request.
    resources:
      requests: { cpu: "100m", memory: "192Mi" }
      limits:   { memory: "512Mi" }
    extraEnv:
      - name: SQA_OPT_OUT
        value: "true"

# Hydra is a public-API add-on (ADR-0305). Off by default — internal-only
# projects run Kratos + Oathkeeper + OpenFGA. The `hydra_thirdparty` flag flips
# `hydra.enabled` on in the per-env GitOps values.
hydra:
  enabled: false
  hydra:
    # Migrations run as an init container before the service container, in every
    # environment (docs/guide/database-migrations.md) — the same shape Kratos
    # runs above. The chart default is a separate Job, applied in the same sync
    # wave as the Deployment with nothing ordering the two.
    automigration:
      enabled: true
      type: initContainer
    config:
      # A placeholder, not the connection Hydra uses: `secret.nameOverride`
      # below sends every pod to the `hydra-secrets` key of the same name. It
      # stays non-empty because the chart wires the DSN env var only when this
      # renders to something, and it carries no password for the same reason
      # the Kratos default does not (infra/auth/kratos/values.yaml).
      dsn: "postgres://hydra@postgres-rw.platform.svc.cluster.local:5432/hydra?sslmode=disable"
      urls:
        self:
          issuer: https://dev.example.com/oauth2/
        login:   https://dev.example.com/auth/login
        consent: https://dev.example.com/auth/consent
        logout:  https://dev.example.com/auth/logout
  # System/cookie secrets + dsn come from a SOPS-managed Secret, never inline
  # values (ADR-0202) — the same wiring Kratos uses. `secret` is a top-level
  # hydra-subchart key (sibling of the `hydra:` config block above), so it sits
  # one level up. `enabled: false` stops the chart minting its own Secret, and
  # `nameOverride` points the deployment, the migration init container and the
  # janitor CronJob at ours instead — `dsn` for all three, plus `secretsSystem`
  # and `secretsCookie` for the server. Any env that sets `hydra_thirdparty`
  # must carry a `hydra-secrets` Secret with those three keys (skeleton:
  # infra/gitops/platform/<env>/secrets/README.md); without it the pods sit in
  # CreateContainerConfigError.
  #
  # `secretsSystem` encrypts every token and consent record Hydra has issued.
  # Rotation is prepend-then-drop, like Kratos's: a value removed while tokens
  # signed under it are live invalidates them all.
  secret:
    enabled: false
    nameOverride: hydra-secrets
