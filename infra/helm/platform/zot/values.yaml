# Values namespaced under `zot:` so this chart shares the platform
# ApplicationSet's single per-env values overlay without key collisions. A
# top-level key here would be read by every OTHER chart's render of the same
# file — and, worse, this chart would ignore the per-environment override that
# names it, which is how a production-disabled component stays enabled.
zot:
  # zot — the image registry (ADR-0105).
  #
  # `enabled` is the umbrella gate. The local tier sets it false: the inner loop
  # pushes to the shared local registry at `registry.localhost:5000`, which exists
  # so a working-tree image never needs a registry the cluster has to authenticate
  # to (ADR-0600).
  enabled: true

  image:
    repository: ghcr.io/project-zot/zot-linux-amd64
    tag: "v2.1.20"
    pullPolicy: IfNotPresent

  # The S3 bucket zot stores images and their referrers in, on the platform's own
  # object store. Image data is never on a node volume (ADR-0105).
  storage:
    bucket: zot-images
    endpoint: seaweedfs.platform.svc.cluster.local:8333
    region: us-east-1
    # http, not https: the store is in-cluster and the hop does not leave it. The
    # off-cluster production store is reached over TLS, which is why this is a value
    # rather than a constant.
    secure: false
    # Untagged manifests unreferenced by a signature or an environment's values are
    # collected on a schedule (ADR-0105). `gcDelay` is the grace an in-flight push
    # gets before its blobs count as garbage — shorter than a slow push and the
    # push collects its own layers.
    gc: true
    gcDelay: 1h
    gcInterval: 24h

  # PULL-THROUGH MIRRORING of the upstream registries (ADR-0105).
  #
  # This is the answer to a problem that is not really about registries: on a
  # proxied or firewalled network, every layer that pulls an image needs its own
  # egress configuration — each Talos node, each kind node, each build host. Point
  # them all at zot instead and exactly ONE component talks to the internet for
  # images. The firewall rule becomes one entry and the node configuration becomes
  # none.
  #
  # `onDemand` rather than a poll: zot fetches an image the first time something
  # asks for it and caches it thereafter. Nothing has to be preloaded, and no list
  # of images has to be derived and kept current — which is the part that rots.
  #
  # Docker Hub is `onDemand` ONLY and must never be polled: it rate-limits pulls
  # and does not support catalog listing, so a poll walks a catalog that is not
  # there and spends the rate limit finding out. zot's own documentation says so.
  #
  # What this does NOT do, and the docs say so plainly: it covers IMAGE pulls. The
  # build path still needs egress for base images and language modules, and
  # non-image traffic — ACME, mail delivery, DMARC reports — is unaffected. This
  # reduces the layers that need a proxy; it does not remove the proxy.
  sync:
    enabled: true
    # Under `/var/lib/zot`, which is the emptyDir the deployment already mounts —
    # a staging directory for in-flight syncs, not a second cache to size.
    downloadDir: /var/lib/zot/sync
    # Retained on the local disk cache as well as the bucket, so a second node
    # pulling the same image does not re-fetch it from upstream.
    registries:
      - urls: ["https://registry-1.docker.io"]
        onDemand: true
        tlsVerify: true
      - urls: ["https://quay.io"]
        onDemand: true
        tlsVerify: true
      - urls: ["https://ghcr.io"]
        onDemand: true
        tlsVerify: true
      - urls: ["https://registry.k8s.io"]
        onDemand: true
        tlsVerify: true

  # Credentials, both halves, from one SOPS-encrypted Secret (ADR-0105, ADR-0202):
  #
  #   htpasswd                 bcrypt lines for the two identities below
  #   AWS_ACCESS_KEY_ID        the store credential zot reads and writes S3 with
  #   AWS_SECRET_ACCESS_KEY
  #
  # bcrypt specifically: zot loads an apr1 file without complaint, reports the right
  # number of users, and then refuses every password (observed 2026-08-19 on 2.1.20).
  credentialsSecret: zot-credentials

  # The two identities ADR-0105 names. Anonymous gets nothing — no policy, so a
  # request without credentials is refused before any repository rule is consulted.
  auth:
    pushUser: ci
    pullUser: cluster

  # The web console (ADR-0306). zot serves the UI and the search API it reads from
  # on the SAME port as the distribution API, so this adds a browser surface to a
  # listener that already exists rather than a second one.
  #
  # It is reached at `zot.ops.<host>` behind the ops forward-auth, never at
  # `registry.<host>`: that origin stays outside the ops label because a registry
  # client follows no redirect to a login page (ADR-0306).
  #
  # `search` is not decoration — the UI is a client of it and renders an empty
  # catalogue without it. zot's CVE scanning is a sub-key of the same extension and
  # is deliberately left off: it downloads a vulnerability database on a schedule,
  # which is egress this component would otherwise not need, and scanning images is
  # admission control's job (ADR-0104).
  console:
    enabled: true

  # A login-free path to the console, on top of the ops gate (ADR-0306). Every
  # other ops dashboard serves anonymously once the edge has proved an AAL2
  # operator; the console cannot, because its access policy is one configuration
  # for one process and the only anonymous lever — `anonymousPolicy: [read]` —
  # opens every pull on `registry.<host>` at the same time (ADR-0105). zot has no
  # per-route knob and neither Traefik nor Oathkeeper can inject a Secret-sourced
  # header, so the credential is presented for the browser by a tiny reverse proxy
  # in this pod (see the deployment). The `zot.ops` origin routes to it; the
  # `registry.<host>` origin still reaches zot directly and is unchanged.
  #
  # The proxy authenticates as the `pullUser` above — the console needs read, which
  # is what the pull identity already has, so this mints no second identity. The
  # pre-encoded `Authorization` value is `consoleAuthorization` in the same Secret,
  # and it MUST match that user's htpasswd password. On by default wherever the
  # console is; a deployed environment that fronts the console differently turns it
  # off here and the `zot.ops` route falls back to the console's own htpasswd.
  consoleAuth:
    enabled: true
    image:
      # Fully qualified: the allow-list generator collects only references that name
      # a registry path, and the local warm set pulls by the same reference.
      repository: docker.io/library/nginx
      tag: "1.27-alpine"
      pullPolicy: IfNotPresent
    # ADR-0204. Measured on 1.27-alpine idle: ~6Mi resident, ~0 CPU. It adds one
    # static header and streams the response; the request rate is an operator
    # clicking a catalogue, not a pull.
    resources:
      requests: { cpu: "10m", memory: "32Mi" }
      limits: { memory: "64Mi" }

  service:
    port: 5000
    # The console proxy's port, the target of the `zot.ops` IngressRoute when
    # `consoleAuth` is on. Distinct from `port` so the registry origin and the
    # console origin reach different containers in the one pod.
    consolePort: 5001

  # Seconds a single request may take. Sized for the largest layer this platform
  # pushes rather than for the API calls that dominate the count — see the
  # configmap for what the default does to a push.
  http:
    readTimeout: 10m
    writeTimeout: 10m

  # ADR-0204. The registry is on the critical path for pod starts, so the limit is
  # the one that decides whether a scale-up succeeds; it is set for a concurrent
  # multi-layer pull rather than for the idle case.
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits: { memory: "1Gi" }
