{{- if .Values.zot.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: zot
  labels:
    app: zot
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app: zot
  ports:
    - { name: http, port: {{ .Values.zot.service.port }}, targetPort: http }
    {{- if and .Values.zot.console.enabled .Values.zot.consoleAuth.enabled }}
    # The console origin (ADR-0306). A second Service port to the login-free proxy
    # container; the `zot.ops` IngressRoute targets this, while `registry.<host>`
    # stays on `http` above and reaches the registry directly.
    - { name: console, port: {{ .Values.zot.service.consolePort }}, targetPort: console }
    {{- end }}
{{- end }}
