{{- if .Values.zot.enabled }}
{{- /*
The registry's configuration, which ADR-0105 makes a committed file rather than
API state. It is rendered from values so the per-environment deltas (bucket,
endpoint) stay in the environment's values file, and everything that is NOT a
per-environment delta is written literally here where it can be read.

Three settings in the JSON below are not obvious, and each was measured against
2.1.20 rather than taken from the documentation:

  - `compat: ["docker2s2"]` accepts Docker's manifest media types. Without it a
    push uploads every blob successfully and the registry then rejects the
    manifest with `manifest invalid` — a failure that arrives at the last step of
    a long upload and reads as a registry defect. `docker buildx` emits those
    media types unless told otherwise, so this is the default path, not a legacy
    one.
  - `defaultPolicy` and `anonymousPolicy` are both empty. An empty list is not
    "unset": it is the absence of any permission, which is what makes an
    unauthenticated request fail at authentication rather than at a repository
    rule. Deleting either line opens the registry.
  - `dedupe` is off. It rewrites blobs as hard links, which an object store does
    not have; on S3 it costs a full scan of the bucket at startup and buys
    nothing.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot
  labels: &labels
    app: zot
    app.kubernetes.io/name: zot
    app.kubernetes.io/part-of: platform
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/zot",
        "dedupe": false,
        "gc": {{ .Values.zot.storage.gc }},
        "gcDelay": "{{ .Values.zot.storage.gcDelay }}",
        "gcInterval": "{{ .Values.zot.storage.gcInterval }}",
        "storageDriver": {
          "name": "s3",
          "region": "{{ .Values.zot.storage.region }}",
          "bucket": "{{ .Values.zot.storage.bucket }}",
          {{- /*
          A URL, with the scheme. zot's storage driver is docker/distribution's,
          whose `regionendpoint` the AWS SDK parses as an endpoint URL — a bare
          `host:port` reads as a scheme-less URI and the driver gives up during
          `parseStorage`, with an exit code and NO message after
          `parsing storage and initializing`. Loki and Tempo take the same address
          as `host:port` because their clients accept that form; the value here is
          the same host and a different contract.
          */}}
          "regionendpoint": "{{ if .Values.zot.storage.secure }}https{{ else }}http{{ end }}://{{ .Values.zot.storage.endpoint }}",
          "secure": {{ .Values.zot.storage.secure }},
          "forcepathstyle": true
        }
      },
      "http": {
        {{- /*
        An image push is a LONG request. A layer arrives as one streamed PATCH and
        zot writes it through to object storage as it goes, so the request lasts as
        long as the slowest of the client link and the store — and upstream's
        60-second default cuts a large layer mid-stream. What the client sees is
        `unexpected EOF` and an endless retry loop; what the registry logs is an
        i/o timeout reading from its own peer, which reads as a network fault
        rather than as its own deadline.

        A DURATION STRING, never a bare number. These are Go durations, so a JSON
        number is nanoseconds: `600` is 600ns, every request past the first byte
        dies instantly, and the edge in front reports 502 while the registry's own
        log shows it answering. Larger is not safer here — it is six hundred
        millionths of a second.
        */}}
        "readTimeout": "{{ .Values.zot.http.readTimeout }}",
        "writeTimeout": "{{ .Values.zot.http.writeTimeout }}",
        "address": "0.0.0.0",
        "port": "{{ .Values.zot.service.port }}",
        "auth": { "htpasswd": { "path": "/etc/zot-auth/htpasswd" } },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                { "users": ["{{ .Values.zot.auth.pushUser }}"], "actions": ["read", "create", "update"] },
                { "users": ["{{ .Values.zot.auth.pullUser }}"], "actions": ["read"] }
              ],
              "defaultPolicy": [],
              "anonymousPolicy": []
            }
          },
          "adminPolicy": { "users": [], "actions": [] }
        },
        "compat": ["docker2s2"]
      },
      "log": { "level": "info" }{{ if .Values.zot.sync.enabled }},
      {{- /*
      The sync extension, making zot a pull-through cache for the upstreams
      (ADR-0105). Anonymous pulls of a MIRRORED image still pass through the
      accessControl above, so the pull identity is the same one the cluster already
      uses — mirroring does not open a second, unauthenticated door into the
      registry.
      */}}
      "extensions": {
        "sync": {
          "enable": true,
          {{- /*
          No `credentialsFile`. Every upstream here is PUBLIC, and naming a file
          that does not exist is how zot fails to start — a registry that will not
          come up is worse than one that pulls anonymously. A private upstream
          would add the file and this key together, never one without the other.
          Docker Hub's anonymous rate limit applies and is the accepted cost; it is
          also why that upstream must stay onDemand rather than polled.
          */}}
          {{- /*
          Where a synced image lands before it is committed to the store. zot
          REFUSES TO START without it whenever sync and a remote storage driver
          are both configured — `using both sync and remote storage features
          needs config.Extensions.Sync.DownloadDir to be specified` — so on S3
          this key is not a tuning option, it is the difference between a
          registry and a CrashLoopBackOff. It shares the emptyDir that holds the
          metadata cache: the contents are a staging area, rebuilt on demand.
          */}}
          "downloadDir": "{{ .Values.zot.sync.downloadDir }}",
          "registries": {{ toJson .Values.zot.sync.registries }}
        }
      }{{ end }}
    }
{{- end }}
