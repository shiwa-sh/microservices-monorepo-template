argo-cd:
  global:
    domain: argocd.example.com
  configs:
    params:
      server.insecure: "true"          # TLS terminates upstream at Traefik
      # Diff against the API SERVER's dry-run rather than against the manifest
      # alone. Every Application here syncs with `ServerSideApply`, and the
      # cluster runs mutating webhooks (CNPG defaults a `Cluster`, Kyverno
      # mutates pods) — so the live object legitimately carries fields the chart
      # never rendered, and a client-side diff calls that drift forever.
      #
      # The cost is not cosmetic. `platform-data` is Healthy only when every
      # Application it generated is Synced AND Healthy, so one permanently
      # OutOfSync resource holds the wave-2 gate shut and every later tier —
      # core, gateway, services — never syncs at all. What it looks like is an
      # Application that reports OutOfSync while `argocd app diff` prints
      # nothing.
      controller.diff.server.side: "true"
    cm:
      timeout.reconciliation: "60s"
      # The ops edge is the authentication gate (Oathkeeper: an AAL2 operator
      # holding dashboard:argocd#view, ADR-0306). Argo trusts it and serves
      # anonymously instead of running a second, redundant login — the same stance
      # Grafana takes (infra/helm/platform/observability/values.yaml). Only AAL2
      # operators ever reach this origin; the anonymous role is set by rbac
      # policy.default below.
      users.anonymous.enabled: "true"
      # ArgoCD's built-in health for ApplicationSet only reflects successful
      # templating ("all Applications generated"), not whether the Applications
      # it spawned actually synced and became healthy. That default makes
      # sync-wave gating on an ApplicationSet a no-op — the ADR-0201 root
      # app-of-apps (root(-local)) relies on the platform ApplicationSets
      # (platform-base wave 0, platform-data wave 2, platform-core wave 3) truly
      # blocking each other and the gateway/services waves until every platform
      # component in the prior tier is up, so this override walks .status.resources
      # (populated with each generated Application's own sync + health status)
      # and reports Progressing until all of them are Synced and Healthy.
      resource.customizations.health.argoproj.io_ApplicationSet: |
        hs = {}
        if obj.status ~= nil and obj.status.resources ~= nil and #obj.status.resources > 0 then
          hs.status = "Healthy"
          hs.message = "All generated Applications are Synced and Healthy"
          for i, r in ipairs(obj.status.resources) do
            if r.status ~= "Synced" or r.health == nil or r.health.status ~= "Healthy" then
              hs.status = "Progressing"
              hs.message = "Waiting for " .. r.name .. " (sync=" .. tostring(r.status) .. ", health=" .. tostring(r.health and r.health.status) .. ")"
              return hs
            end
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for ApplicationSet to generate Applications"
        return hs
      # CNPG Cluster health. Without this, ArgoCD's default assessment reports an
      # unknown CRD Healthy the instant its manifest applies — so the data-tier
      # ApplicationSet (postgres) would gate-close before the database is actually
      # accepting connections, and the core tier (ory/temporal/openfga/pgweb,
      # ADR-0201 wave 3) would start against a not-yet-ready Postgres. Report
      # Healthy only when the operator says the cluster is up with all instances
      # ready.
      resource.customizations.health.postgresql.cnpg.io_Cluster: |
        hs = {}
        if obj.status ~= nil then
          local ready = obj.status.readyInstances
          local want = obj.status.instances
          if obj.status.phase == "Cluster in healthy state"
             and ready ~= nil and want ~= nil and ready == want and ready > 0 then
            hs.status = "Healthy"
            hs.message = obj.status.phase
            return hs
          end
          hs.status = "Progressing"
          hs.message = tostring(obj.status.phase)
                       .. " (" .. tostring(ready) .. "/" .. tostring(want) .. " ready)"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for CNPG cluster status"
        return hs
      # Helm-rendered CRDs carry explicit empty maps (`labels: {}`,
      # `annotations: {}`) that ArgoCD's normalizer strips from the DESIRED object
      # but not from the LIVE one — so a chart shipping CRDs (kyverno) drifts
      # `labels: {}` forever and sits OutOfSync. That OutOfSync then blocks the
      # ApplicationSet health check above (it demands every generated app Synced),
      # which freezes the root app-of-apps on its first wave. Ignore the empty-map
      # churn on CRD metadata; the labels Kyverno applies for its own bookkeeping
      # are unchanged.
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        {
          "jsonPointers": ["/metadata/labels", "/metadata/annotations"]
        }
      # Kyverno's CRD schema defaults four fields the chart never sets
      # (`spec.admission`, `spec.emitWarning`, and per rule
      # `skipBackgroundRequests` and `validate.allowExistingViolations`). Under
      # ServerSideApply the controller owns only the fields it sent, so a
      # defaulted field belongs to no manager and the client-side diff reads it
      # as drift that no sync can remove — the policy app sits OutOfSync forever,
      # which closes the ApplicationSet health gate above and freezes the root
      # app-of-apps. Ignore the defaults; every field the chart states is still
      # compared.
      resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
        {
          "jsonPointers": ["/spec/admission", "/spec/emitWarning"],
          "jqPathExpressions": [
            ".spec.rules[].skipBackgroundRequests",
            ".spec.rules[].validate.allowExistingViolations"
          ]
        }
    rbac:
      # Anonymous (edge-authenticated operator, see users.anonymous above) gets
      # admin — mirroring Grafana's anonymous org_role:Admin. The edge already
      # proved AAL2 + the dashboard:argocd grant; full UI access is the point.
      policy.default: role:admin
  server:
    service: { type: ClusterIP }
  redis-ha: { enabled: false }         # 3-node embedded etcd; HA Redis is overkill (ADR-0200)
  redis:
    # Chart defaults to the ecr-public.aws.com vanity host, which only publishes
    # AAAA records; pin the canonical public.ecr.aws mirror (identical image,
    # IPv4-reachable) so redis doesn't wedge on IPv6-less networks.
    image:
      repository: public.ecr.aws/docker/library/redis
  # ADR-0204. The chart declares no resources at all, so without these every Argo
  # component runs on the namespace LimitRange's 512Mi default — including the
  # application controller, which is the one process that makes GitOps happen.
  #
  # **What that failure looks like is not a crash.** The controller OOMs, restarts,
  # reconciles for a while, OOMs again; meanwhile every Application keeps its last
  # status, so the UI shows a fleet of Synced+Healthy apps that are synced to a
  # commit from hours ago. The tell is `status.reconciledAt` falling behind, and a
  # refresh annotation that stays on the object because nothing consumed it.
  #
  # What decides the number is the number of Applications and the resources they
  # track, not cluster size — plus server-side diff (configs.params above), which
  # adds a dry-run apply per resource. Measured: OOMKilled at 512Mi with 39
  # Applications on a three-node cluster.
  controller:
    replicas: 1
    resources:
      requests: { cpu: "250m", memory: "512Mi" }
      limits: { memory: "2Gi" }
  # The repo server renders every chart in the fleet, each render holding a
  # dependency tree in memory.
  repoServer:
    resources:
      requests: { cpu: "100m", memory: "256Mi" }
      limits: { memory: "1Gi" }
  applicationSet:
    replicas: 1
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits: { memory: "512Mi" }
