minio:
  enabled: true   # umbrella gate (Chart.yaml condition); prod sets this false
  # Stable service name `minio` regardless of the Helm release name. Under ArgoCD
  # the release is `<env>-platform-minio`, so without this the Service would be
  # `<env>-platform-minio` and the loki/tempo endpoints (which target
  # `minio.platform.svc`) would not resolve.
  fullnameOverride: minio
  mode: standalone
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  # ADR-0204. Measured 2026-07-26: 262Mi working set, 15m CPU. The memory limit was
  # MISSING here (a request without a limit is half the rule), which left the object
  # store free to grow into the node until the kernel picked a victim.
  resources:
    requests: { cpu: "50m", memory: "320Mi" }
    limits:   { memory: "768Mi" }
  # `restricted` (ADR-0200). The chart already runs the server as uid/gid 1000 with
  # a matching fsGroup for the PVC; what it never asserted was that this is a
  # non-root user, and it sets no seccomp profile at all. The keys land in the pod
  # securityContext verbatim (the template does `omit ... "enabled"`), so adding
  # them here is enough — but note the whole block is gated on
  # `persistence.enabled`, which is true above and must stay true for any of this
  # to render.
  securityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  # The container half. `readOnlyRootFilesystem: false` is upstream's default and is
  # kept: MinIO writes its config under the root filesystem, and that field is not
  # part of `restricted` anyway.
  containerSecurityContext:
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  # The bucket-creation Job (`minio-post-job`, a Helm post-install hook) is a
  # separate workload with its own three security-context switches, none of them
  # covered by the server's above. It is one-shot, so a rejected Job leaves nothing
  # Running to notice — the buckets simply never appear and Loki/Tempo fail on their
  # first write. `containerSecurityContext` is not in the chart's defaults at all;
  # the template reads it only when the sibling `securityContext.enabled` is true.
  postJob:
    securityContext:
      enabled: true
      runAsNonRoot: true
      seccompProfile: { type: RuntimeDefault }
  makeBucketJob: &minioJobContainer
    securityContext:
      enabled: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  makeUserJob: *minioJobContainer
  rootUser: minio
  rootPassword: minio-password
  # No phone-home: the MinIO server checks dl.min.io for a newer release on
  # startup, which default-deny egress drops (observed by putting an L7 DNS
  # visibility policy on the cluster and reading the query off the wire). The
  # binary is pinned by the chart's appVersion and upgraded deliberately, so the
  # check has nothing to tell us even when it succeeds.
  environment:
    MINIO_UPDATE: "off"
  # One bucket per backend consumer (platform/observability charts), matching
  # the names each chart's own values.yaml expects.
  buckets:
    - { name: platform-backups,      policy: none, purge: false }
    - { name: loki-chunks,           policy: none, purge: false }
    - { name: loki-ruler,            policy: none, purge: false }
    - { name: loki-admin,            policy: none, purge: false }
    - { name: tempo-traces,          policy: none, purge: false }
