{{- if .Values.mailpit.enabled }}
## Mailpit — the non-production mail sink (ADR-0307). Only the Kratos COURIER
## submits to it, so 1025 is granted to that pod and to nothing else.
##
## The courier is a StatefulSet of its own (`ory-kratos-courier`), not the Kratos
## server: the server queues a message and the courier drains the queue, so the
## server never opens an SMTP connection. Selecting `app.kubernetes.io/name: kratos`
## here matches the wrong pod and drops every message — invisibly, because a
## courier that cannot connect retries on its own schedule and the flow it serves
## has already returned success to the user.
##
## The viewer (8025) gets no ingress rule: ADR-0306's routed-origin table does not
## name Mailpit, so nothing in-cluster reaches the UI and a port-forward does not
## traverse this policy.
##
## Egress is absent on purpose. A sink that never delivers has nowhere to go, and
## the baseline (00-baseline.yaml) already grants the DNS every pod needs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailpit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: ory-kratos-courier
      toPorts:
        - ports: [{ port: "1025", protocol: TCP }]
{{- end }}
