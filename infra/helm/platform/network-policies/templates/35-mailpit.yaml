{{- if .Values.mailpit.enabled }}
## Mailpit — the non-production mail sink (ADR-0307). Two senders submit to it and
## 1025 is granted to those two and to nothing else: the Kratos COURIER, and
## Alertmanager's ticket receiver (ADR-0502), which relays through the same mail
## path every sender uses.
##
## The courier is a StatefulSet of its own (`ory-kratos-courier`), not the Kratos
## server: the server queues a message and the courier drains the queue, so the
## server never opens an SMTP connection. Selecting `app.kubernetes.io/name: kratos`
## here matches the wrong pod and drops every message — invisibly, because a
## courier that cannot connect retries on its own schedule and the flow it serves
## has already returned success to the user.
##
## The viewer (8025) is an ops origin (ADR-0306), so the edge reaches it and
## nothing else does. Traefik terminates in kube-system and Oathkeeper gates the
## request before it arrives, so this rule grants the namespace rather than a
## session — the authorization decision is not a network one.
##
## Egress is absent on purpose. A sink that never delivers has nowhere to go, and
## the baseline (00-baseline.yaml) already grants the DNS every pod needs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailpit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: ory-kratos-courier
      toPorts:
        - ports: [{ port: "1025", protocol: TCP }]
{{- if .Values.alertmanager.enabled }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports: [{ port: "1025", protocol: TCP }]
{{- end }}
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        # Enforced on the pod's real containerPort 8025, which the Service fronts
        # on the same number.
        - ports: [{ port: "8025", protocol: TCP }]
{{- end }}
