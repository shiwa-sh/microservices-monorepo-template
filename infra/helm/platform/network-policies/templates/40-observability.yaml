## Egress to the node-level OTel collector, which runs in its own namespace
## (ADR-0200 — hostPath and hostPorts, so PSA keeps it apart). The baseline's
## intra-namespace allow covered this while the agent shared this namespace and does
## not now; without this rule every platform workload's OTLP export is denied, and
## the symptom is telemetry that simply stops rather than an error anyone sees.
##
## Namespace-wide on the source side because the sources ARE the namespace: every
## workload emits. The ports are the two OTLP receivers and nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otlp-egress
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }} }
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
            - { port: "4318", protocol: TCP }
---
## Loki — writes come from the OTel collector, reads from Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3100", protocol: TCP }]
---
## Prometheus — OTLP metrics push from BOTH collectors (the DaemonSet agent and
## the otel-cluster singleton), queries from Grafana (all 9090). otel-cluster
## missing here is exactly what the ClusterStateMetricsAbsent alert fires on —
## its push was netpol-dropped from 2026-07-23's first deploy until this rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: otel-cluster }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
        # The alert-hygiene report reads the ALERTS series (ADR-0502). Named here
        # rather than left to the baseline: what may query the metrics store is a
        # list, and a reader absent from it is a reader nobody decided on.
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: alertmanager-hygiene-report }
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
---
## otel-cluster → Kyverno's metrics (ADR-0104, ADR-0500). The only cross-namespace
## scrape in this repo, and it needs an EGRESS rule because the baseline allows
## reaching `platform` and nothing else — Kyverno runs in its own namespace, since
## it excludes the namespace it lives in from every policy.
##
## Measured: with the scrape config and no rule, the collector discovers all four
## controllers and every scrape fails. The symptom is an empty admission dashboard
## and an alert that never fires, which is the same shape as the prometheus rule
## below it — that push was netpol-dropped from the day it was written.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-cluster-kyverno-scrape
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-cluster
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kyverno
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
---
## Tempo — trace push (OTLP 4317/4318) from OTel, queries (3200) from Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tempo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: {{ .Values.otelAgentNamespace }}, app.kubernetes.io/name: opentelemetry-collector }
      toPorts:
        - ports:
            - { port: "4317", protocol: TCP }
            - { port: "4318", protocol: TCP }
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3200", protocol: TCP }]
---
## MinIO — object storage for Loki/Tempo (9000). Console (9001) is edge-only.
## The minio-post-job (app: minio-job) provisions the buckets + users Loki/Tempo
## need, so it must reach 9000 too — without it every backend crashloops
## on "bucket does not exist".
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio
spec:
  endpointSelector:
    matchLabels:
      app: minio
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: loki }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: tempo }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app: minio-job }
      toPorts:
        - ports: [{ port: "9000", protocol: TCP }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "9001", protocol: TCP }]
---
## Pyroscope — profile pushes from the Alloy agent, queries from Grafana (4040).
## The scrape path (Alloy → service admin ports) needs no rule here: services grant
## platform-namespace ingress to their admin port, and the baseline policy grants
## intra-namespace egress (ADR-0501 POC).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pyroscope
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: alloy }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: platform, app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "4040", protocol: TCP }]
---
## Alloy — the pprof scraper (ADR-0501). Its egress to live pods is already
## covered by the baseline's intra-namespace rule; this adds the same reachability
## by CIDR so a target that was deleted between two service-discovery refreshes
## does not read as `world` and get denied.
##
## Same root cause as the temporal stale-member allow (20-temporal.yaml), but a
## much shorter window: Alloy re-resolves its targets within a minute or two, so
## these drops never sustain the 10m PolicyDropsDetected needs. They do, however,
## land on the overview dashboard's drop tile — which is scoped to POLICY_DENIED
## and reddens above 0.01/s — after every rollout, and a tile that flickers red
## during routine deploys is a tile people learn to ignore.
##
## Scoped to the admin port only: that is the pprof/metrics endpoint services
## expose (values.yaml server.adminPort), and it is the only port Alloy scrapes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toCIDR: [{{ .Values.podCIDR | quote }}]
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
---
## Grafana — the ops UI, reached only through the edge gateway (3000).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
