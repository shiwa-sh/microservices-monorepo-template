# When true, allow the log/trace backends (loki/tempo) egress to external
# HTTPS — needed in prod, where object storage is a real off-cluster S3 bucket
# (ADR-0206). Local runs against in-cluster MinIO (covered by intra-namespace
# egress), so it stays false and no pod reaches the internet at all.
externalObjectStorage: false

# The namespace the node-level OTel collector runs in (ADR-0200 — it needs hostPath
# and hostPorts, and PSA's exception unit is the namespace). Every platform workload
# exports telemetry to it, and the baseline's intra-namespace allow does not reach
# across a namespace boundary, so this name appears in four rules in
# templates/40-observability.yaml. It matches `namespace` in the otel-agent chart.
otelAgentNamespace: otel-agent

# The cluster's pod CIDR (kind's kubeadm default, 10.244.0.0/16 — ADR-0206; the
# k3s era used 10.42.0.0/16).
#
# Used ONLY by the "stale peer" allows (20-temporal.yaml, 40-observability.yaml),
# where a workload keeps dialling the IP of a pod that has since been deleted.
# Cilium resolves a pod IP to an identity, and a deleted pod has none, so the
# address falls back to the `world` identity and every identity-based allow —
# including the baseline's intra-namespace rule — stops matching it. The traffic
# is then denied, which is what fills PolicyDropsDetected after any rollout.
#
# Matching by CIDR is the only construct that survives that: `toEntities: cluster`
# is identity-based and has the same blind spot. It is deliberately paired with a
# tight port list at each use site, so it grants "may reach a pod address on the
# ports this workload already uses", not "may reach the pod network".
#
# Override per env if the cluster is not on the kind default.
podCIDR: "10.244.0.0/16"
