# Values namespaced under `alertmanager:` so this chart shares the platform
# overlay with its siblings (ADR-0205).

# The hygiene report runs promtool, which ships in the Prometheus image. Pinned
# here rather than read from the observability chart: a chart renders from its
# own values alone.
prometheusImage: prom/prometheus:v3.1.0

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.28.1
    pullPolicy: IfNotPresent
  replicas: 1
  httpPort: 9093

  # Alertmanager holds notification state (what has fired, what is silenced) on
  # disk. One replica on an emptyDir: the state is a de-duplication cache, and
  # losing it re-notifies rather than loses an alert. HA is a three-peer gossip
  # cluster, which is a scale decision this platform has not taken.
  resources:
    requests: { cpu: "20m", memory: "64Mi" }
    limits:   { memory: "256Mi" }

  # The `ticket` path. ADR-0307 makes every sender speak SMTP, so this is a host,
  # a port, and a credential like any other relay target — mailpit below the
  # production tier, maddy in it.
  email:
    to: platform-alerts@localtest.me
    from: alertmanager@localtest.me
    smarthost: mailpit.platform.svc.cluster.local:1025
    # The sink speaks plaintext and authenticates nobody. A deployed environment
    # sets this true and points smarthost at maddy.
    requireTLS: false

  # The `page` path, and the seam ADR-0502 defers on-call rotation behind. It
  # resolves to nothing until a paging service is attached, which is a URL and a
  # credential — no rule and no severity changes when it is.
  webhook:
    url: ""

  # The heartbeat path, and a SEPARATE seam from the webhook above. The Watchdog
  # is a dead man's switch (ADR-0502): it fires every repeat interval forever, so
  # a destination shared with `page` puts a contentless message in front of
  # whoever is on call, every five minutes, between the alerts that matter. That
  # is the alert fatigue ADR-0502 names as the failure mode.
  #
  # Its consumer is a machine with the inverted contract — quiet while pings
  # arrive, loud when they stop (Dead Man's Snitch, Healthchecks.io, Cronitor, or
  # any endpoint that times out). Empty here like the webhook: the seam ships
  # wired to nothing, and the in-cluster watchdogCheck CronJob covers the
  # "Alertmanager up but not routing" case either way. What only an external
  # consumer covers is the cluster going down with its own watcher.
  watchdogWebhook:
    url: ""

  # Reconciles live silences to infra/observability/alertmanager/silences.yaml.
  # Ten minutes bounds how long a silence created in the UI survives, which is
  # what makes the runbook's "vanishes on the next reconcile" true.
  silenceSync:
    schedule: "*/10 * * * *"

  # Asserts the Watchdog is still arriving. Five minutes matches the routing
  # tree's repeat interval for it, so a missed heartbeat is caught in one cycle
  # rather than averaged away.
  watchdogCheck:
    schedule: "*/5 * * * *"

  # The page/ticket hygiene report. Weekly, because it is a trend rather than an
  # event and a daily copy of the same list is itself alert fatigue.
  hygieneReport:
    schedule: "0 6 * * 1"
    prometheusURL: http://prometheus.platform.svc.cluster.local:9090
    # Minutes a `page` rule may spend firing in 30 days before it is proposed for
    # demotion. Six hours: a severity asserting a human acts within minutes has
    # no business firing for a working day a month.
    firingMinutesThreshold: 360

  # How long Alertmanager waits to batch an alert group, and how long before it
  # re-notifies about a group that is still firing.
  groupWait: 30s
  groupInterval: 5m
  repeatInterval: 12h
