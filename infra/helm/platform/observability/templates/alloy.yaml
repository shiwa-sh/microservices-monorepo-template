# Grafana Alloy (ADR-0501 POC) — the pprof-scraping agent that feeds Pyroscope.
# It discovers pods in the platform namespace, keeps those exposing the `admin`
# port (the pprof endpoint every Go service serves via obs.Init, ADR-0500), scrapes
# CPU/heap/goroutine profiles, and pushes them to Pyroscope. Runs as a single
# Deployment (not a DaemonSet): pull-based profiling is node-agnostic, and one
# replica keeps the POC footprint small.
#
# No new NetworkPolicy is needed for the scrape path: services already allow
# platform-namespace ingress to their admin port, and the baseline policy already
# allows every platform pod intra-namespace egress + API-server access (for the
# Kubernetes pod discovery below).
{{- $al := .Values.alloy }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
---
# Cluster-scoped: pod discovery watches across the API. Name is prefixed so it does
# not collide with any other Alloy install in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
data:
  config.alloy: |
    {{- include "observability.alloy.config" . | nindent 4 }}
{{/* Config in a define so the Deployment stamps checksum/config and rolls on
     config edits (same pattern as pyroscope.yaml / otel-cluster.yaml). Without it
     a config change updates the ConfigMap, kubelet syncs the file into the pod,
     and the running process keeps the config it parsed at startup — the edit is
     live on disk and inert in memory, which reads as a fix that did not work. */}}
{{- define "observability.alloy.config" }}
// Discover every pod, then keep only platform-namespace pods that expose the
// `admin` container port (9090) — i.e. the Go services' pprof endpoint.
discovery.kubernetes "pods" {
  role = "pod"
}

discovery.relabel "pprof" {
  targets = discovery.kubernetes.pods.targets

  rule {
    source_labels = ["__meta_kubernetes_namespace"]
    regex         = "platform"
    action        = "keep"
  }
  // The pprof target is the port named `admin` AND numbered 9090 (service chart
  // values.yaml `server.adminPort`). Both rules are required, because each name
  // and each number is used by something that is not a pprof endpoint:
  //
  //   - SeaweedFS names its admin UI port `admin` at 23646. It serves no
  //     /debug/pprof, and its policy admits the edge alone
  //     (network-policies 15-object-storage.yaml).
  //   - Prometheus (`http`) and the four Temporal roles (`metrics`) use 9090 for
  //     something else, and their policies do not admit Alloy either.
  //
  // Keeping on one condition alone selects those, and every scrape of them is a
  // permanent netpol drop that fills PolicyDropsDetected.
  rule {
    source_labels = ["__meta_kubernetes_pod_container_port_name"]
    regex         = "admin"
    action        = "keep"
  }
  rule {
    source_labels = ["__meta_kubernetes_pod_container_port_number"]
    regex         = "9090"
    action        = "keep"
  }
  // Label profiles so Grafana can filter by service and pod. service_name
  // matches the RED/log/trace label the rest of the dashboards use.
  rule {
    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
    target_label  = "service_name"
  }
  rule {
    source_labels = ["__meta_kubernetes_pod_name"]
    target_label  = "pod"
  }
}

// Scrape the standard Go pprof profiles (CPU, heap, goroutine on by default)
// from /debug/pprof and forward them to Pyroscope.
pyroscope.scrape "pprof" {
  targets    = discovery.relabel.pprof.output
  forward_to = [pyroscope.write.local.receiver]
}

pyroscope.write "local" {
  endpoint {
    url = "http://pyroscope.platform.svc.cluster.local:4040"
  }
}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy, app.kubernetes.io/part-of: observability }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
      # Roll the pod whenever the config changes — Alloy parses its config at
      # startup and does not re-read the mounted file.
      annotations:
        checksum/config: {{ include "observability.alloy.config" . | sha256sum }}
    spec:
      serviceAccountName: alloy
      # `restricted` (ADR-0200). The alloy image ships USER root, so runAsNonRoot
      # alone would only turn admission into a kubelet refusal at start — the UID
      # has to be named. 473 is the `alloy` user the image creates, and the one the
      # upstream chart uses; the storage path below is an emptyDir, so fsGroup
      # matches it rather than a volume's ownership.
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alloy
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          image: {{ $al.image }}
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            # No phone-home (same stance as grafana.ini analytics): without this
            # Alloy dials Grafana Labs' usage-stats endpoint on 443, which the
            # default-deny egress correctly drops — pure PolicyDropsDetected noise.
            - --disable-reporting
            - /etc/alloy/config.alloy
          ports:
            - { name: http, containerPort: 12345 }
          readinessProbe: { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 10 }
          livenessProbe:  { httpGet: { path: /-/ready, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources: {{- toYaml $al.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: data,   mountPath: /var/lib/alloy/data }
      volumes:
        - name: config
          configMap: { name: alloy }
        - name: data
          emptyDir: {}
