# Prometheus (ADR-0500): the Core-tier metrics store — a single prom/prometheus
# process with a local TSDB and native OTLP ingest, no object-storage dependency.
# One Deployment, mirroring Loki (SingleBinary) and Tempo. The horizontally
# scalable, object-storage-backed variant is the Mimir Scale swap (see values.yaml
# and docs/operational-surface.md), not this floor.
{{- $p := .Values.prometheus }}
{{/* The config lives in a define so the Deployment below can stamp its sha256
     as a pod-template annotation: without that checksum a config edit updates
     the ConfigMap but never rolls the pod, and Prometheus keeps running the
     old config indefinitely (how the rule_files stanza sat unloaded until
     2026-07-23 — /api/v1/rules returned [] while the mounted files were valid). */}}
{{- define "observability.prometheus.config" }}
    global:
      scrape_interval: 30s
    # OTLP metrics arrive from the OTel collector (--web.enable-otlp-receiver).
    # Escape OTel dotted names to the classic Prometheus form (dots→underscores) +
    # unit/type suffixes: `http.server.request.duration` (seconds) becomes
    # http_server_request_duration_seconds_bucket, `orders.checkouts_started` becomes
    # orders_checkouts_started_total. This is the conventional Prometheus naming every
    # dashboard/PromQL example assumes — the alternative (NoUTF8Escaping, dotted
    # names) forces awkward `{"a.b.c"}` quoting on every query and is what left the
    # RED dashboard showing "No data". Resource attributes are otherwise dropped from
    # series, so promote service.name/namespace to labels dashboards can group by.
    otlp:
      translation_strategy: UnderscoreEscapingWithSuffixes
      # Resource attributes are otherwise dropped from series. Promote service.name/
      # namespace so dashboards can group by service — this is the label the RED, log,
      # trace AND kubeletstats CPU/memory series (ADR-0501 POC) all share, since
      # k8sattributes derives service.name from each pod's app.kubernetes.io/name.
      # k8s.deployment.name / k8s.statefulset.name: otel-cluster folds role
      # deployments into one service identity (orders-server + orders-worker →
      # orders); these labels keep the folded series distinct (else the two
      # deployments' desired/available would collide on an identical labelset)
      # and give the workload-health alerts a per-deployment subject to name.
      # k8s.volume.* : the kubeletstats `volume` metric group reports free space per
      # volume, and the identifying attributes are resource-level — unpromoted,
      # every volume in the cluster collapses onto one labelset (measured: 12
      # identical series) and nothing can name which disk is filling up.
      #
      # k8s.persistentvolumeclaim.name and k8s.volume.type are listed but do NOT
      # resolve on the local tier: local-path PVs are directories on the node disk,
      # so kubelet reports every volume — configMap, secret, emptyDir and PVC alike
      # — with the NODE filesystem's numbers and without a claim reference.
      # Locally that makes per-volume free space a duplicate of node disk, which is
      # why the disk alerts key off k8s_node_filesystem_* instead. On a real CSI
      # storage class these attributes appear and the per-volume panel becomes the
      # per-claim signal it looks like.
      #
      # k8s.node.name: the kubeletstats `node` metric group reports per-NODE
      # numbers, and the node's identity is resource-level like the volume
      # attributes above. Unpromoted, every node's k8s_node_* series carries an
      # empty labelset, so a multi-node cluster collapses them all onto one
      # identity and NodeDiskSpaceLow fires without naming the node or the
      # filesystem it read. A single-node cluster hides this, because one
      # collapsed series and one real series look the same.
      promote_resource_attributes:
        [
          "service.name",
          "service.namespace",
          "k8s.deployment.name",
          "k8s.statefulset.name",
          "k8s.node.name",
          "k8s.persistentvolumeclaim.name",
          "k8s.volume.name",
          "k8s.volume.type",
        ]
    # OTLP pushes can land slightly out of order across collector batches.
    storage:
      tsdb:
        out_of_order_time_window: 30m
    # Services push via OTLP; nothing is scraped by default.
    scrape_configs: []
    # Alerts-as-code (ADR-0500): rule files from infra/observability/alerts/,
    # delivered as the `prometheus-alerts` ConfigMap by the prometheus-alerts
    # ArgoCD Application (same pattern as the Grafana dashboards ConfigMap) and
    # mounted below.
    rule_files:
      - /etc/prometheus/rules/*.yaml
    # Alertmanager routes every alert (ADR-0502). Evaluation stays here and
    # routing happens there — one primitive per concern. A firing alert remains
    # visible on /alerts and as the ALERTS series regardless, which is what
    # dashboards and the e2e suite query.
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ .Values.prometheus.alertmanagerTarget }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
data:
  prometheus.yml: |
    {{- include "observability.prometheus.config" . }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
spec:
  # A StatefulSet, because the TSDB below is a ReadWriteOnce volume. A Deployment
  # carrying one deadlocks its own rolling update: the replacement pod waits for a
  # volume the outgoing pod still holds, and the rollout never completes.
  serviceName: prometheus
  replicas: {{ $p.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
      # Roll the pod whenever the config changes — Prometheus only reads its
      # config at startup (no reloader sidecar in the Core stack). NOTE: this
      # covers the `prometheus` ConfigMap only; edits to the separately-synced
      # `prometheus-alerts` ConfigMap still need a restart (see volume below).
      annotations:
        checksum/config: {{ include "observability.prometheus.config" . | sha256sum }}
    spec:
      # `restricted` (ADR-0200). 65534 is `nobody`, which is what the image already
      # runs as — but the number has to be written out, because the image declares
      # it by NAME and the kubelet will not start a runAsNonRoot container whose
      # image user is non-numeric (it cannot resolve the name without running the
      # image, so it refuses to certify the user is not root). Admission passes and
      # the pod then sits in CreateContainerConfigError. fsGroup matches so the
      # emptyDir TSDB below is writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          image: {{ $p.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/data
            - --storage.tsdb.retention.time={{ $p.retention }}
            - --web.enable-otlp-receiver
            - --web.listen-address=0.0.0.0:{{ $p.httpPort }}
          ports:
            - { name: http, containerPort: {{ $p.httpPort }} }
          readinessProbe: { httpGet: { path: /-/ready,   port: http }, initialDelaySeconds: 15 }
          livenessProbe:  { httpGet: { path: /-/healthy, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
          resources: {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules,  mountPath: /etc/prometheus/rules }
            - { name: data,   mountPath: /data }
      volumes:
        - name: config
          configMap: { name: prometheus }
        # Alert rules from infra/observability/alerts/ (prometheus-alerts Argo
        # app). Mounted read-only under the config dir; rule_files (above) globs
        # it. Rule edits land in the ConfigMap on the next Argo pass and load on
        # the next pod restart/config reload.
        - name: rules
          configMap: { name: prometheus-alerts }
  # The TSDB. It was an emptyDir, which made every stated retention a statement
  # about permission rather than about data: a rollout, an eviction or a node
  # restart emptied it, and the 30-day SLO window, the burn-rate rules and the
  # alert-hygiene report's 30-day lookback all read a history the platform did not
  # keep (ADR-0500, ADR-0207).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $p.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: observability }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: {{ $p.httpPort }}, targetPort: http }
