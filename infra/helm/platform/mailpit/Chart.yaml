apiVersion: v2
name: mailpit
description: |
  Mailpit, the non-production mail sink (ADR-0307). Kratos's courier submits
  verification and recovery mail here instead of to a recipient, which is what the
  never-deliver-to-a-real-recipient Rule requires of every non-production
  environment. Single stateless Go binary, messages held in memory.

  Not deployed in production: production submits through maddy. Set
  mailpit.enabled=false in an env overlay to drop it, as prod does.
type: application
version: 0.1.0
appVersion: "1.30.7"
