# Values namespaced under `seaweedfs:` so this chart shares the platform
# ApplicationSet's single per-env values overlay without key collisions. A
# top-level key here would be read by every OTHER chart's render of the same
# file — and, worse, this chart would ignore the per-environment override that
# names it, which is how a production-disabled component stays enabled.
seaweedfs:
  # SeaweedFS, the platform's object store (ADR-0207).
  #
  # `enabled` is the umbrella gate, read by this chart's own templates rather than a
  # Chart.yaml condition: the chart has no subchart to condition on. Production sets
  # it false — ADR-0207 puts the production store outside the cluster, and a store
  # that runs on the cluster it backs shares the failure domain it exists to survive.
  enabled: true

  image:
    repository: chrislusf/seaweedfs
    # One minor behind the head release. A store is the conservative slot under
    # ADR-0000 principle 4, and the newest tag has had days rather than weeks of
    # field exposure.
    tag: "4.41"
    pullPolicy: IfNotPresent

  # Buckets are created by the server at startup from `-bucket`, so there is no
  # provisioning Job to schedule, to secure, or to notice the failure of. MinIO
  # needed one (`minio-post-job`), and it was one-shot: a rejected Job left nothing
  # Running, the buckets simply never appeared, and Loki and Tempo crashlooped on
  # "bucket does not exist".
  #
  # One bucket per backend consumer, matching the names each chart's own values
  # expect. Creation is idempotent — an existing bucket is left alone.
  buckets:
    - platform-backups
    - loki-chunks
    - loki-ruler
    - loki-admin
    - tempo-traces
    # The registry's own store (ADR-0105): images and the signatures, SBOMs and
    # provenance attached to them as OCI referrers.
    - zot-images

  # The S3 root credential, as `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY` in a
  # Secret this chart only names. The same Secret carries `ADMIN_PASSWORD` for the
  # admin UI, which is a second credential rather than the same one: the UI
  # administers the store and the S3 key reads and writes objects in it. `weed mini` reads that pair on first start and
  # creates the identity from it; until an identity exists the S3 endpoint answers
  # every anonymous request with 403 (verified 2026-08-19 against 4.41).
  #
  # The pair is delivered by the per-environment SopsSecret (ADR-0202), which is the
  # same secret the consumers read, so the store and its clients cannot drift apart.
  credentialsSecret: object-storage-root

  persistence:
    size: 5Gi
    # Unset means the cluster's default StorageClass, which is what every tier
    # running this chart has (ADR-0207: volumes are node-local).
    storageClassName: ""

  # ADR-0204. Measured 2026-08-19 in a container running these exact flags: 73 MiB
  # resident and 0.3% of one core at idle, with the five buckets created.
  #
  # **Idle is not the sizing case, and 512Mi was set from it.** The load that
  # decides this limit is an IMAGE PUSH: the registry writes an image's layers to
  # this store as multipart uploads, several parts in flight, and the buffers are
  # proportional to the layers rather than to the request rate a dashboard shows.
  # At 512Mi the store was OOMKilled mid-push — and the failure surfaces entirely
  # in the registry's log, as `connection refused` to a Service whose pod is
  # Running again by the time anyone looks.
  resources:
    requests: { cpu: "50m", memory: "256Mi" }
    limits: { memory: "1.5Gi" }

  # No phone-home: the master reports anonymous cluster statistics to
  # telemetry.seaweedfs.com by default, which default-deny egress would drop anyway.
  # Turning it off at the source means the platform is not relying on a network
  # policy to keep a promise the workload can keep itself.
  telemetry: false

  service:
    s3Port: 8333
    # The admin UI, and the only surface ADR-0306 routes. It authenticates on its
    # own — `-admin.password` empty would disable that, and the edge gate would be
    # the only thing between an operator session and the store's administration. The master and filer UIs
    # are diagnostic and are reached by port-forward, so they get no Service port:
    # an origin per internal view multiplies edge surface for no capability the
    # admin UI lacks.
    adminPort: 23646
