{{- if .Values.seaweedfs.enabled }}
{{- /*
`weed mini` — master, volume, filer, S3 gateway and admin UI in one process
(ADR-0207). A StatefulSet rather than a Deployment because the identity and the
volume are the same thing here: the volume holds the only copy of every object,
so a second pod attaching to a fresh PVC would be an empty store answering
requests, not a replica.

Replicas is not a value. One process IS the shape ADR-0207 chose for the
in-cluster tiers; a second replica of `mini` is two independent stores sharing a
Service, which fails as data that is sometimes there.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels: &labels
    app: seaweedfs
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: platform
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        # The image's own `seaweed` user, which owns /data in the image. Running
        # as anything else means the first write fails on a directory the process
        # cannot create into, and `fsGroup` is what carries that ownership onto
        # the PVC, which arrives owned by root.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: "{{ .Values.seaweedfs.image.repository }}:{{ .Values.seaweedfs.image.tag }}"
          imagePullPolicy: {{ .Values.seaweedfs.image.pullPolicy }}
          args:
            - mini
            - -dir=/data
            - -master.telemetry={{ .Values.seaweedfs.telemetry }}
            - -bucket={{ join "," .Values.seaweedfs.buckets }}
            {{- if .Values.seaweedfs.adminAuth.enabled }}
            # Kubernetes expands `$(VAR)` in args from the container's own env, so
            # the password reaches the flag without appearing in the pod spec.
            # `weed` takes it as a flag and nothing else — there is no environment
            # variable for it.
            - -admin.password=$(ADMIN_PASSWORD)
            {{- end }}
          env:
            # `weed mini` turns this pair into the S3 identity on first start. It
            # is the whole authentication story of the endpoint: with no identity
            # configured every anonymous request is refused, so an empty Secret
            # fails closed rather than opening the store.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.seaweedfs.credentialsSecret }}, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.seaweedfs.credentialsSecret }}, key: AWS_SECRET_ACCESS_KEY }
            {{- if .Values.seaweedfs.adminAuth.enabled }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.seaweedfs.credentialsSecret }}, key: ADMIN_PASSWORD }
            {{- end }}
          ports:
            - { name: s3, containerPort: {{ .Values.seaweedfs.service.s3Port }} }
            - { name: admin, containerPort: {{ .Values.seaweedfs.service.adminPort }} }
          # `restricted` (ADR-0200). The root filesystem is read-only, which the
          # process tolerates only because /tmp is writable below: it opens unix
          # sockets at /tmp/seaweedfs-<component>-<port>.sock for the in-process
          # components to reach each other.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          # The S3 endpoint, not the master or the filer: a store whose S3 layer is
          # not answering is down for every consumer this platform has, however
          # healthy the components behind it are.
          readinessProbe:
            httpGet: { path: /status, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /status, port: s3 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{ toYaml .Values.seaweedfs.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.seaweedfs.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.persistence.size }}
{{- end }}
