# Traefik middlewares (ADR-0305). These replace the deleted Tyk
# SecurityPolicies (infra/gateway/policies/): the edge validates identity via
# Oathkeeper ForwardAuth, throttles auth-sensitive routes, and stamps static
# browser-security headers on every response.
---
# ForwardAuth → Oathkeeper decisions API. Oathkeeper validates the Kratos
# session / Hydra JWT, strips client-supplied identity headers, and returns the
# authoritative ones; authResponseHeaders is what Traefik copies onto the
# upstream request, so a client cannot spoof them.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oathkeeper-forward-auth
  namespace: platform
spec:
  forwardAuth:
    address: http://ory-oathkeeper-api.platform.svc.cluster.local:4456/decisions
    authResponseHeaders:
      - X-User-Id
      - X-Org-Id
      - X-Roles
      - X-User-Email
---
# Anti-spoofing (ADR-0305, ADR-0306). Strip ALL client-supplied identity headers
# at ingress, before forwardAuth, so a client cannot inject an identity on any
# route — especially anonymous/cached ones where Oathkeeper's mutator would not
# overwrite them. Oathkeeper re-adds the authoritative values; authResponseHeaders
# then copies only those onto the upstream. Setting a customRequestHeader to ""
# removes that header in Traefik. This middleware is applied first on every route.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity-headers
  namespace: platform
spec:
  headers:
    customRequestHeaders:
      X-User-Id: ""
      X-Org-Id: ""
      X-Roles: ""
      X-User-Email: ""
---
# Rate limit for auth-sensitive routes (login, signup, recovery). Per source IP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
  namespace: platform
spec:
  rateLimit:
    average: 10
    burst: 20
    period: 1m
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Static browser-security headers applied to all responses (ADR-0305, ADR-0400).
# The per-request CSP nonce (script-src) is set by the frontend; here we set
# only the directives that never vary per request.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: platform
spec:
  headers:
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    customResponseHeaders:
      Content-Security-Policy: "frame-ancestors 'none'"
---
# RFC 9457 problem details for the edge's own errors (ADR-0305).
#
# A generated client has ONE error branch, and that only holds if a denial from the
# edge looks like a denial from a service. Oathkeeper's `json` handler emits
# `{"error":{"code":…}}` and takes no body template, so it cannot be configured
# into compliance — this intercepts the response instead and serves the body from
# `edge-errors`, which holds one document per status.
#
# Traefik keeps the ORIGINAL status code and replaces only the body and its
# Content-Type. Verified on the local tier: an Oathkeeper denial arrives as its
# status with `Content-Type: application/problem+json` and an RFC 9457 body.
#
# This must come FIRST in every chain. Middlewares wrap the ones after them, so a
# denial raised by `oathkeeper-forward-auth` is only visible to something listed
# above it.
#
# The intercepted set is deliberately narrow, because the middleware matches on
# STATUS and cannot see where a response came from — see the `problems` list in
# infra/helm/platform/edge-errors/values.yaml for why 404 is not in it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: problem-json-errors
  namespace: platform
spec:
  errors:
    status:
      - "401"
      - "403"
      - "429"
      - "502"
      - "503"
      - "504"
    service:
      name: edge-errors
      port: 80
    # `{status}` is substituted by Traefik with the intercepted status code, so one
    # rule serves every document without a middleware per status.
    query: "/{status}.json"
