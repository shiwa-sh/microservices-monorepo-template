# Argo CD (ADR-0201). server.insecure is on, so TLS terminates at Traefik and
# argocd-server serves http on :80. Argo is installed into its own `argocd`
# namespace (not `platform`), so the service ref is cross-namespace — the same
# pattern as Hubble UI in kube-system. This needs Traefik allowCrossNamespace, on
# locally via the committed Traefik chart (infra/helm/platform/traefik/values.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-argocd
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^argocd\.ops\..+`)
      middlewares:
        # First in the chain: middlewares wrap the ones after them, so a denial
        # raised by forward-auth below is only visible to something listed above
        # it (ADR-0305).
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        - name: security-headers
      services:
        - name: argocd-server
          namespace: argocd
          port: 80
  tls:
    secretName: wildcard-ops-tls
