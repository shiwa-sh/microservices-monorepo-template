# SeaweedFS admin (ADR-0306, ADR-0207) — non-prod only, admin UI at root on
# :23646, and the sole exposed surface of the store. The master and filer UIs are
# diagnostic and are reached by port-forward: an origin per internal view
# multiplies CSP, rate-limit and session surface for no capability this one lacks.
#
# The UI carries its own credential behind this gate, so an operator meets two
# checks rather than one. The network policy admits :23646 from the gateway's
# namespace alone, so the second check cannot be walked around from inside.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ops-seaweedfs
  namespace: platform
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: HostRegexp(`^seaweedfs\.ops\..+`)
      middlewares:
        # First in the chain: middlewares wrap the ones after them, so a denial
        # raised by forward-auth below is only visible to something listed above
        # it (ADR-0305).
        - name: problem-json-errors
        - name: strip-identity-headers
        - name: oathkeeper-forward-auth
        - name: security-headers
      services:
        - name: seaweedfs
          port: 23646
  tls:
    secretName: wildcard-ops-tls
---
