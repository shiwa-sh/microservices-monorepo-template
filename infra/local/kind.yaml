# Local inner-loop cluster (ADR-0600). kind runs upstream Kubernetes on a kubeadm
# node, which is the closest local shape to the distribution the full tier runs.
#
# Flannel/kube-proxy stay off: Cilium is the CNI (ADR-0206), and kind declines
# kube-proxy at create time (kubeProxyMode: none). Ports 8080/8443 map the edge: the local values run Traefik as a
# NodePort (nodePorts 30080/30443 — the 30000+ range is what kind's node can
# serve), and these host→node mappings are what make https://<host>:8443 reach it.
# The 30080/30443 numbers must match infra/helm/platform/traefik/values.yaml.
#
# Kubelet tuning (registry-qps/burst=0 lifts the per-registry image-pull rate limiter, which only throttles
# cold reschedules against our OWN registry; eviction-hard pinned at 2% free keeps
# kubelet from evicting the whole platform over a few spare GB; image-gc thresholds
# at 98/80 stop the perpetual ImageGCFailed noise on a near-full developer disk).
#
# Proxied networks: kind cannot inject node environment, so
# a proxied machine preloads images on the host instead — CLUSTER_PRELOAD=1 runs
# cluster:preload (host docker pull + kind load docker-image), and
# cluster:unwedge rescues anything that still wedges reactively. See
# docs/dev-loop.md ("HTTP proxies").
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            registry-qps: "0"
            registry-burst: "0"
            eviction-hard: "imagefs.available<2%,nodefs.available<2%"
            image-gc-high-threshold: "98"
            image-gc-low-threshold: "80"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
      - containerPort: 30443
        hostPort: 8443
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
# The local registry (ADR-0205 parity): a plain registry container on the kind
# docker network (created by scripts/cluster-ensure.sh), the node pulls
# repo-built images from registry.localhost:5000 exactly as a deployed tier pulls
# from ghcr. The endpoint carries an explicit http:// scheme, which is how
# containerd marks a registry as plain-HTTP.
#
# The UPSTREAM registries are mirrored at the same address (ADR-0105). On a proxied
# or firewalled network every layer that pulls an image otherwise needs its own
# egress configuration — this node, the Talos nodes, the build host. Pointing them
# all at one mirror means exactly one component talks to the internet for images.
#
# containerd falls back to the upstream registry when a mirror does not have the
# image, so this is an accelerator rather than an allow-list; Kyverno is the
# allow-list (ADR-0104).
#
# `kind load` is unaffected and stays the fast path for repo-built images: it
# copies from the host image store and never touches a registry.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.localhost:5000"]
      endpoint = ["http://registry.localhost:5000"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["http://registry.localhost:5000", "https://registry-1.docker.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."quay.io"]
      endpoint = ["http://registry.localhost:5000", "https://quay.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."ghcr.io"]
      endpoint = ["http://registry.localhost:5000", "https://ghcr.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.k8s.io"]
      endpoint = ["http://registry.localhost:5000", "https://registry.k8s.io"]
