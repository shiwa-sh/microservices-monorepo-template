# Make the env host resolve to the edge FROM INSIDE the cluster (ADR-0016).
#
# `dev.localtest.me` is real public DNS that resolves to 127.0.0.1. That is exactly
# right on the host and exactly wrong in a pod, where 127.0.0.1 is the pod's own
# loopback — so an in-cluster frontend dialling EDGE_INTERNAL_ORIGIN would connect
# to itself instead of Traefik. This is the second of the three blockers that kept
# the frontend from running as its production image locally.
#
# Rewriting the NAME (rather than pointing the frontend at a Service DNS name) is
# what keeps the rest of the stack honest: the /api IngressRoutes match on
# Host(dev.localtest.me) and the wildcard cert is issued for it, so the request must
# genuinely carry that host and that SNI. A cluster-internal name would fail both.
#
# k3s's CoreDNS imports /etc/coredns/custom/*.override into its default server
# block, sourced from this ConfigMap. Local-only: deployed environments resolve
# their real host through real DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  labels: { local.platform/component: base }
data:
  # k3s ships Traefik in kube-system as the `traefik` Service.
  edge.override: |
    rewrite stop {
      name exact dev.localtest.me traefik.kube-system.svc.cluster.local
      answer auto
    }
    rewrite stop {
      name regex (.*)\.dev\.localtest\.me traefik.kube-system.svc.cluster.local
      answer auto
    }
