# Alerts-as-code (ADR-0500). This directory is a chart so that the Prometheus rule
# files beside this file become the `prometheus-alerts` ConfigMap the observability
# chart mounts at /etc/prometheus/rules (rule_files globs that directory).
#
# A chart rather than a Kustomize generator for two reasons ADR-0201 states: it is
# the one templating system this repo uses, and the ConfigMap has to be GENERATED,
# because a rule file is native Prometheus format the API server has no kind for.
# An Argo CD directory source applies manifests, so it cannot deliver these files
# at all.
#
# The template globs, so adding a rule file is adding the file.
apiVersion: v2
name: prometheus-alerts
description: Committed Prometheus rule files, delivered as the ConfigMap Prometheus mounts (ADR-0500).
type: application
version: 0.1.0
