all:
  children:
    servers:
      hosts:
        # Committed inventory of pre-provided hosts (ADR-0200) — the day-one
        # path. Fill in the SSH-reachable IPs of the machines you were given;
        # the first host initializes the embedded etcd, the rest join.
        # `{project}-{env}-{role}[-{n}]` (ADR-0003). `example` is the placeholder
        # project slug this template ships with — replace it with the real one at
        # instantiation, in every surface at once. All three are `cp`: this is a
        # three-node embedded-etcd control plane, not one server and two workers.
        example-dev-cp-1: { ansible_host: 203.0.113.11 }
        example-dev-cp-2: { ansible_host: 203.0.113.12 }
        example-dev-cp-3: { ansible_host: 203.0.113.13 }
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
