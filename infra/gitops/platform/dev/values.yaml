# Per-env platform overrides (ADR-0201).
# Top-level `cluster:` — the postgres chart's own values schema has no
# `postgres:` namespace wrapper (unlike the dependency subcharts below).
cluster:
  instances: 3
  storage: { size: 50Gi }
  backup:
    retentionPolicy: "7d"
    s3: { endpointURL: "http://seaweedfs.platform.svc.cluster.local:8333", destinationPath: "s3://platform-backups/postgres" }

# Non-prod object storage is in-cluster SeaweedFS, not the off-cluster store
# (ADR-0205). Override each backend's S3 endpoint; prod keeps the chart
# defaults (the off-cluster bucket) and disables this chart entirely.
loki:
  loki:
    storage:
      s3:
        endpoint: seaweedfs.platform.svc.cluster.local:8333
        s3ForcePathStyle: true
        insecure: true
tempo:
  tempo:
    storage:
      trace:
        s3:
          endpoint: seaweedfs.platform.svc.cluster.local:8333
          insecure: true

# Lowdefy admin console (ADR-0401): the one repo-built platform image. Pulled from
# ghcr and promoted by git SHA on merge (promote-on-merge), exactly like the Go
# services and the frontend. Local uses the local registry (platform/local/values.yaml).
lowdefy:
  # The registry this environment pulls from authenticates every pull (ADR-0105).
  imagePullSecrets:
    - name: registry-pull
  image:
    repository: ghcr.io/tabmadi/microservices-monorepo-template/admin
    tag: "0000000000000000000000000000000000000000"   # bumped by promote-on-merge

# Talos ships no storage provisioner and nothing else claims the default
# StorageClass here (ADR-0200), so this is what an unannotated PVC resolves to.
# The laptop tier leaves it off — kind brings its own.
localPath:
  enabled: true

# The wildcard host this environment serves, and the ACME account that certifies
# it (ADR-0205). Both are placeholders an adopter replaces: the certificates are
# derived from the host, and Let's Encrypt sends expiry warnings and account
# recovery to the address. Neither has a default a template could pick, so the
# chart fails the render rather than issuing a certificate for `*.`.
envHost: dev.example.com
publicTls:
  enabled: true
  envHost: dev.example.com
  acme:
    email: ops@example.com

# Identity, at this environment's host. The canonical auth config (infra/auth) is
# written against a placeholder, and every one of these is a URL a BROWSER is sent
# to — so an environment that does not override them redirects its operators to a
# domain it does not own, and the failure is a login page that never loads rather
# than anything naming the wrong host.
#
# TOTP and WebAuthn are domain-bound on top of that: a second factor enrolled
# against the wrong relying party cannot be presented to this one.
kratos:
  kratos:
    config:
      serve:
        public:
          base_url: "https://dev.example.com/auth/"
      selfservice:
        default_browser_return_url: https://dev.example.com/
        # The apex, and every ops origin. The ops entry is what makes a denied
        # panel request return to that panel after login: Oathkeeper puts the
        # origin in `return_to`, and Kratos follows it only if it is listed here.
        allowed_return_urls:
          - https://dev.example.com/
          - https://*.ops.dev.example.com/
        flows:
          error:        { ui_url: https://dev.example.com/auth/error }
          login:        { ui_url: https://dev.example.com/auth/login }
          registration: { ui_url: https://dev.example.com/auth/register }
          recovery:     { ui_url: https://dev.example.com/auth/recovery }
          verification: { ui_url: https://dev.example.com/auth/verification }
          settings:     { ui_url: https://dev.example.com/auth/settings }
        methods:
          totp:
            config:
              issuer: dev.example.com
          webauthn:
            config:
              rp:
                id: dev.example.com
                display_name: Platform
                origins: ["https://dev.example.com"]
      # The ops tools are served at their own origins under `ops.<host>`
      # (ADR-0306), so the session cookie has to cover the whole host rather than
      # the apex alone.
      session:
        cookie:
          domain: dev.example.com

# Where Oathkeeper sends an unauthenticated browser request (ADR-0305).
oathkeeper:
  oathkeeper:
    config:
      errors:
        handlers:
          redirect:
            config:
              to: https://dev.example.com/auth/login
