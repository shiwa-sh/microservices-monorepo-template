# Local full-tier values for the analytics service (ADR-0700, ADR-0205).
name: analytics
image:
  repository: registry.localhost:5000/analytics-server
  tag: local            # local registry (CI stand-in); prod uses a git SHA (ADR-0101)
  pullPolicy: Always    # re-pull the rebuilt :local on a cluster:up full re-run
worker: { enabled: false }
server:  { replicas: 1 }
# No /api edge route. Nothing in a browser calls this service: the browser emits
# through Faro, and the collector's routing connector delivers here east-west
# (ADR-0700). An edge route would be a public surface for an internal write path.
ingress: { enabled: false }
# Keep every trace the service starts (ADR-0500: local overrides healthy traces
# to 100%). The chart default samples 10% in the SDK, and the collector's local
# 100% cannot restore a span the SDK never started — so a developer looking for
# the request they just made, and the e2e trace assertion, would both be playing
# odds.
otel:    { deployEnv: local, sampling: "parentbased_traceidratio=1.0" }
secrets: { envFrom: [analytics-db] }
networkPolicy:
  allowFromGateway: false
  # The node-level OTel collector is the only caller — it is what splits
  # `marketing.*` out of the logs pipeline and delivers the batch here.
  allowFrom: [otel-agent, frontend]
