# Local full-tier values for the orgs service (ADR-0205). See orders.yaml for the
# secret-naming note (orgs-db = local SopsSecret resource).
name: orgs
image:
  repository: registry.localhost:5000/orgs-server
  tag: local            # local registry (CI stand-in); prod uses a git SHA (ADR-0101)
  pullPolicy: Always    # re-pull the rebuilt :local on a cluster:full re-run
worker:
  enabled: true            # RegisterUser dual-write (ADR-0302/0010)
  image:
    repository: registry.localhost:5000/orgs-worker
    tag: local
server:  { replicas: 1 }
ingress: { enabled: true, host: dev.localtest.me, resources: [orgs] }
otel:    { deployEnv: local }
# Kratos calls /identity-created east-west on the server port (ADR-0304); the
# edge (allowFromGateway) only covers Traefik → /api/orgs, so allow Kratos too.
# The Lowdefy admin console (apps/admin) also calls orgs server-side (ADR-0401).
networkPolicy: { allowFrom: [kratos, lowdefy] }
secrets: { envFrom: [orgs-db, openfga-creds] }
env:
  # Write authz (ADR-0304): the worker grants org admin via the shared OpenFGA
  # Granter. Blank preshared key falls back to openfga-creds.preshared_key (envFrom).
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  OPENFGA_PRESHARED_KEY: ""
