# Local full-tier values for the payment service (ADR-0205). See orders.yaml for
# the secret-naming note (payment-db = local SopsSecret resource). Locally there is
# no separate payment-temporal-creds secret (Temporal runs without per-service
# creds), so only payment-db is mounted.
name: payment
image:
  repository: registry.localhost:5000/payment-server
  tag: local            # local registry (CI stand-in); prod uses a git SHA (ADR-0101)
  pullPolicy: Always    # re-pull the rebuilt :local on a cluster:up full re-run
worker:
  enabled: true
  image:
    repository: registry.localhost:5000/payment-worker
    tag: local
server:  { replicas: 1 }
ingress: { enabled: true, host: dev.localtest.me, resources: [charges] }
# Keep every trace the service starts (ADR-0500: local overrides healthy traces
# to 100%). The chart default samples 10% in the SDK, and the collector's local
# 100% cannot restore a span the SDK never started — so a developer looking for
# the request they just made, and the e2e trace assertion, would both be playing
# odds.
otel:    { deployEnv: local, sampling: "parentbased_traceidratio=1.0" }
# The Lowdefy admin console (apps/admin) calls payment server-side, east-west on
# the server port, bypassing the /api edge (ADR-0401). `orders` covers the checkout
# saga: the orders worker's ChargeActivity dials payment east-west (ADR-0302).
networkPolicy: { allowFrom: [lowdefy, orders] }
secrets: { envFrom: [payment-db, openfga-creds] }
env:
  # Write authz (ADR-0304): the server gates the operator-only refund via the shared
  # Checker. Blank preshared key falls back to openfga-creds.preshared_key (envFrom),
  # as catalog and the authz service do.
  OPENFGA_API_URL: "http://openfga.platform.svc.cluster.local:8080"
  OPENFGA_PRESHARED_KEY: ""
