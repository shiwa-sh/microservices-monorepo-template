# Local values for the frontend (ADR-0205, ADR-0600).
#
# This file is half of what makes `mise run cluster:add -- frontend` work; the other
# half is service-deploy.sh knowing that a deployable can live under apps/ and build
# from its own Dockerfile. Without both, no local run ever exercised the standalone
# Next server, NODE_ENV=production, or the image CI builds and prod deploys, and a
# Dockerfile or standalone-output regression was only catchable after a push.
#
# Three things had to change before this file could work; all three are done and
# none of them is local-only sugar:
#   1. EDGE_ORIGIN split into public/internal (src/lib/server-fetch/server.ts) —
#      the pod dials :443, the browser's CSRF allowlist needs :8443.
#   2. A CoreDNS rewrite (scripts/lib/cluster.sh) so dev.localtest.me
#      resolves to Traefik in-cluster instead of the pod's own loopback.
#   3. A real local CA (infra/helm/platform/cert-manager/templates/issuers.yaml)
#      so the edge cert can be TRUSTED rather than have verification disabled.
#      This image sets no NODE_TLS_REJECT_UNAUTHORIZED — that is the point.
#
# The daily loop is still the host `next dev` behind the edge glue. Use this when
# you need the production container: verifying the Dockerfile, standalone output,
# or a production-only rendering difference.
name: frontend
image:
  # The local registry, like every other service (ADR-0205): this file is what the
  # services ApplicationSet generates the frontend's Application from, so a bare
  # node-resident `frontend:local` means the full tier pulls from Docker Hub, gets
  # `insufficient_scope`, and sits in ImagePullBackOff until someone runs
  # `cluster:add -- frontend` by hand. cluster:up full builds and pushes this tag.
  #
  # `cluster:add` still works: it overrides repository and tag with a timestamped
  # node-resident image, which is the point of that path.
  repository: registry.localhost:5000/frontend
  tag: local            # local registry (CI stand-in); prod uses a git SHA (ADR-0101)
  pullPolicy: Always    # re-pull the rebuilt :local on a cluster:up full re-run
worker: { enabled: false }
server:
  port: 3000
  # No admin port: a Next standalone server serves one port. The chart defaults
  # probe /readyz and /livez on `admin`, so both are overridden below.
  adminPort: null
  replicas: 1
  probes:
    readiness: { httpGet: { path: /api/healthz, port: http }, initialDelaySeconds: 2, timeoutSeconds: 4 }
    liveness:  { httpGet: { path: /api/healthz, port: http }, periodSeconds: 30 }
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { memory: "768Mi" }
# Catch-all `/`. The glue route in infra/local/edge-auth.yaml holds priority 1 so
# this one wins whenever it exists, and the host `next dev` takes over again as
# soon as it is removed.
ingress: { enabled: true, host: dev.localtest.me, pathPrefix: "/" }
migrations: { enabled: false }
# Keep every trace the service starts (ADR-0500: local overrides healthy traces
# to 100%). The chart default samples 10% in the SDK, and the collector's local
# 100% cannot restore a span the SDK never started — so a developer looking for
# the request they just made, and the e2e trace assertion, would both be playing
# odds.
otel: { deployEnv: local, sampling: "parentbased_traceidratio=1.0" }
env:
  # East-west targets for the cluster-audience services the analytics panel reads
  # (ADR-0700). These have no /api route, so the edge origin above cannot reach
  # them and the panel dials the Services directly.
  ANALYTICS_URL: http://analytics-server.platform.svc.cluster.local
  AUTHZ_URL: http://authz-server.platform.svc.cluster.local
  # Kratos public, for resolving the session cookie to an identity on a page
  # render. A page carries no injected identity header — see the note in the
  # shared chart's ingressroute template for why.
  KRATOS_PUBLIC_URL: http://ory-kratos-public.platform.svc.cluster.local
  # The browser's origin — the local edge maps host 8443 to Traefik's 443. next.config.mjs
  # derives the server-action CSRF allowlist from this, so it must carry the port.
  EDGE_PUBLIC_ORIGIN: https://dev.localtest.me:8443
  # What this pod dials. Same host — the /api IngressRoutes match on it and the
  # wildcard cert is issued for it — resolved to Traefik by the CoreDNS rewrite.
  EDGE_INTERNAL_ORIGIN: https://dev.localtest.me
  # Trust the local CA rather than disabling verification. The secret is mounted
  # below; `ca.crt` is the anchor cert-manager writes there.
  NODE_EXTRA_CA_CERTS: /etc/ssl/local-ca/ca.crt
secrets:
  # The chart names the volume after the Secret (secretName: .name), so `name` here
  # IS the Secret cert-manager writes the CA into.
  files:
    - name: local-ca-tls
      mountPath: /etc/ssl/local-ca
