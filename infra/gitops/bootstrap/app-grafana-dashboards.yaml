# Grafana dashboards Application (ADR-0500). Makes dashboards-as-code actually flow
# through GitOps: the chart at infra/observability/dashboards generates the
# `grafana-dashboards` ConfigMap from the *.json beside it, which the observability
# Helm chart mounts (dashboardsConfigMaps.default). Its template globs, so adding a
# dashboard is adding the file. Without this Application the ConfigMap is
# materialised once at bootstrap and untracked by Argo, and a committed dashboard
# change never reaches the cluster. Picked up by the root app-of-apps, which
# recurses infra/gitops/bootstrap.
#
# Env-agnostic (the same JSON in every env), like the shared gateway app,
# so it has no single-env AppProject and stays in `default`.
#
# Sync-wave 2 (the data-tier slot): the ConfigMap must exist BEFORE the core tier
# (wave 3) starts Grafana, which mounts it as a volume. A plain ConfigMap is Healthy
# the moment it applies, so wave 3 is not delayed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    # Wave 2: one before the telemetry tier that MOUNTS this ConfigMap. A volume
    # its pod cannot find leaves that pod unstartable, so the config is delivered
    # a wave early rather than beside the workload it configures.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/tabmadi/microservices-monorepo-template.git
    targetRevision: master
    path: infra/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 20
      backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
