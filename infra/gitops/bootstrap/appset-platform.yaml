    # Wave 6: LAST, because nothing waits on an operator console. These are read
    # surfaces over the platform (ADR-0501) — no workload resolves them, and the
    # gateway's ops routes are IngressRoutes that answer once the backend appears.
    # Gating the services wave on them made every service wait for a dashboard, and
    # put ~25 more pods on one node while Temporal was electing.
    argocd.argoproj.io/sync-wave: "6"
