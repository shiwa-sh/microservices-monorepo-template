  name: platform-data
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: data
  annotations:
    # Wave 2: after base (operator up) and the secrets tier (wave 1, local) so
    # Postgres finds its superuser Secret instead of CreateContainerConfigError.
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync has to survive this ApplicationSet's own
  # reconcile. Without this, `spec.syncPolicy` is re-applied from the template
  # within seconds, auto-sync comes back, and self-heal reverts whatever
