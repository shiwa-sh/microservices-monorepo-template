# Platform ApplicationSets (ADR-0201). The platform tier is split into four
# dependency layers, each its own ApplicationSet so ArgoCD can order them:
#
#   base (wave 0)  — sops-operator, cert-manager, network-policies, resource-governance
#                    Foundational, dependency-free. sops-operator must run before
#                    any SopsSecret CR can be decrypted into Secrets (ADR-0202).
#                    Cilium and Argo CD are NOT in it — they precede Argo and are
#                    installed imperatively in every tier (see the generator).
#   data (wave 2)  — postgres, seaweedfs. The storage layer everything else sits on;
#                    needs the Secrets produced by the base + secrets tiers.
#   core (wave 3)  — zot, otel-agent, ory, edge-errors, mailpit, maddy, temporal,
#                    temporal-worker-controller, openfga. Consumers of the data
#                    layer (Postgres DSNs, the buckets), and everything a later
#                    wave resolves by name.
#   ops (wave 6)   — observability, alertmanager, pgweb, headlamp, lowdefy. Read
#                    surfaces (ADR-0501). Last, because no workload waits on a
#                    console, and holding the services wave open for one costs the
#                    whole tier the slowest dashboard.
#
# WHY FOUR SETS AND NOT PER-CHART SYNC-WAVES: sync-waves on the Applications a
# single ApplicationSet generates are INERT — those Applications are created by
# the ApplicationSet controller, not synced as resources of a parent, so ArgoCD
# never sequences them (it applies them all concurrently). Real ordering exists
# only at the granularity of a root-app-of-apps child. Each set here is such a
# child; its own sync-wave (the metadata annotation below, NOT the template one)
# is what root honours. The gate is made real by the custom ApplicationSet health
# check (infra/helm/platform/argocd/values.yaml), which reports a set Healthy
# only once every Application it generated is Synced+Healthy — so wave 2 waits for
# every wave-0/1 component to actually be up, and so on. Charts WITHIN a tier are
# still applied concurrently and must tolerate that.
#
# Wave ladder (root children): -10 projects · 0 base · 1 secrets · 2 data ·
# 3 core · 4 gateway · 5 services · 6 ops.
#
# The four sets share an identical template body (the same auth valueFiles /
# fileParameters wiring as before; non-Ory/OpenFGA charts ignore the extra keys).
# Only the generator's directory list and the set's own sync-wave differ.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-base
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: base
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync has to survive this ApplicationSet's own
  # reconcile. Without this, `spec.syncPolicy` is re-applied from the template
  # within seconds, auto-sync comes back, and self-heal reverts whatever
  # scripts/platform-deploy.sh just installed — the deploy reports success and the
  # cluster keeps running the committed image. `cluster:add` is the whole
  # working-tree path (ADR-0600), so the field it pauses is the one field this set
  # must not own.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
                - { env: staging, server: "https://kubernetes.default.svc" }
                - { env: prod,    server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/microservices-monorepo-template.git
              revision: master
              directories:
                  # Namespaces + their Pod Security Admission profile (ADR-0200).
                  # First in the base tier and sync-wave -1 inside it: a namespace
                  # labelled after its pods are admitted governs nothing, because
                  # PSA is an admission check.
                - { path: "infra/helm/platform/namespaces" }
                  # The default StorageClass (ADR-0200). Base tier, and ahead of
                  # the data tier by construction: a PVC created before a default
                  # StorageClass exists stays Pending with no class to resolve, and
                  # nothing re-binds it when one appears. Talos ships no
                  # provisioner, so without this every stateful chart hangs at its
                  # first volume. The laptop tier leaves it off — kind brings its
                  # own.
                - { path: "infra/helm/platform/local-path" }
                  # Admission control (ADR-0104). In the BASE tier because a
                  # policy that arrives after the workloads it gates has already
                  # missed them: admission is evaluated once, at creation.
                - { path: "infra/helm/platform/kyverno" }
                - { path: "infra/helm/platform/sops-operator" }
                - { path: "infra/helm/platform/cert-manager" }
                - { path: "infra/helm/platform/network-policies" }
                  # ADR-0204 guardrails (PriorityClass, LimitRange, ResourceQuota,
                  # PDB). Base tier because a LimitRange only defaults pods created
                  # AFTER it exists, and the PriorityClasses must exist before any
                  # workload names one — a pod naming a missing class is rejected.
                - { path: "infra/helm/platform/resource-governance" }
                - { path: "infra/helm/platform/temporal-worker-controller-crds" }
                # CILIUM AND ARGO CD ARE DELIBERATELY NOT HERE, in any tier.
                #
                # Neither can be installed by the thing it is a prerequisite of:
                # no pod schedules before the CNI exists, and Argo cannot apply
                # its own first install. Both come up imperatively ahead of Argo
                # (scripts/lib/cluster.sh and scripts/cluster.sh / the equivalent
                # prod bootstrap), which is the one-time `kubectl apply` step
                # ADR-0201 permits.
                #
                # Listing either here does not merely duplicate that install — it
                # BREAKS it. Every Application this set generates targets the
                # `platform` namespace, while Cilium runs in `kube-system` and
                # Argo CD in `argocd`, and both charts' RBAC is CLUSTER-SCOPED:
                # the rendered ClusterRoleBinding keeps its name and rebinds the
                # subject to `platform:<sa>`, overwriting the correct binding.
                #
                # Measured on a three-node cluster, both faults reproduced from a
                # clean install:
                #
                #   kubectl get clusterrolebinding cilium-operator -o \
                #     jsonpath='{.subjects[0].namespace}'            -> platform
                #   kubectl auth can-i get namespaces --as=system:\
                #     serviceaccount:kube-system:cilium-operator      -> no
                #
                # on a cluster whose ClusterRole granted exactly that verb. The
                # operator then crashloops on `namespaces "kube-system" is
                # forbidden` while every agent still reports healthy; new pods
                # stop getting identities and sit in ContainerCreating with no
                # events at all.
                #
                # Argo CD fails the same way one level up — its own controller
                # loses cluster access and reports
                # `namespaces "platform" is forbidden: User
                # "system:serviceaccount:argocd:argocd-application-controller"`,
                # so every other Application in the set stops syncing.
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: "{{ .path.basename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/microservices-monorepo-template.git
        targetRevision: master
        path: "{{ .path.path }}"
        helm:
          # Stable Helm release name = chart basename, so resources are named the
          # same under ArgoCD as under a direct `helm install <chart>` (a bare
          # release name would prefix every resource with the app name and break
          # in-cluster DNS / cross-component refs).
          releaseName: "{{ .path.basename }}"
          # Auth single-source (Phase 0.4): the Ory app pulls kratos/oathkeeper
          # config from the canonical infra/auth tree; OpenFGA pulls its schema.
          # Non-Ory/OpenFGA charts ignore these extra keys. The per-env file layers
          # last so its host/dsn/secret overrides win (later valueFiles precede).
          valueFiles:
            # First, so anything below can still override it: the deletions of
            # upstream defaults that a wrapper chart's own values.yaml cannot
            # express (see the file's header).
            - "../../../gitops/platform/shared-values.yaml"
            # Generated: the repositories the platform's charts pull from, which
            # Kyverno's allow-list policy reads (ADR-0104).
            - "../../../gitops/platform/image-allowlist.yaml"
            - "../../../auth/kratos/values.yaml"
            - "../../../auth/oathkeeper/values.yaml"
            - "../../../gitops/platform/{{ .env }}/values.yaml"
          fileParameters:
            - name: 'kratos.kratos.identitySchemas.user\.v1\.json'
              path: "../../../auth/kratos/identity-schemas/user.v1.json"
            - name: oathkeeper.oathkeeper.accessRules
              path: "../../../auth/oathkeeper/access-rules.json"
            - name: seed.model
              path: "../../../auth/openfga/model.json"
            # The one copy of the platform's signing public key (ADR-0104). Empty
            # in the template, which renders no policy — see infra/auth/cosign.
            - name: policies.publicKey
              path: "../../../auth/cosign/cosign.pub"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
---
