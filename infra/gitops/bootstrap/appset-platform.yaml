apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-core
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: core
  annotations:
    # Wave 4: everything a service resolves by name — its identity provider, its
    # authorization store, its workflow engine, the collector it ships telemetry to,
    # and the mail sink the courier submits to. zot is here for the deployed shape
    # rather than for DNS: nodes pull images from it, so it precedes anything that
    # starts later, and it needs the wave-2 bucket.
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync has to survive this ApplicationSet's own
  # reconcile. Without this, `spec.syncPolicy` is re-applied from the template
  # within seconds, auto-sync comes back, and self-heal reverts whatever
  # scripts/platform-deploy.sh just installed — the deploy reports success and the
  # cluster keeps running the committed image. `cluster:add` is the whole
  # working-tree path (ADR-0600), so the field it pauses is the one field this set
  # must not own.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - { env: dev,     server: "https://kubernetes.default.svc" }
                - { env: staging, server: "https://kubernetes.default.svc" }
                - { env: prod,    server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/microservices-monorepo-template.git
              revision: master
              directories:
                # The registry (ADR-0105). Wave 3 rather than beside the store: it
                # reads the bucket, so it starts after the data tier is Healthy.
                - { path: "infra/helm/platform/zot" }
                  # The forge (ADR-0102). Renders nothing unless an environment
                  # enables it, which none do by default — deploying the forge that
                  # hosts this repository from the Argo instance that syncs it is
                  # the bootstrap circularity, and it is a decision rather than a
                  # default.
                - { path: "infra/helm/platform/forgejo" }
                  # The public ACME issuer and the edge's wildcard certificates
                  # (ADR-0205). Core tier, not base: a DNS-01 solver needs the
                  # token the secrets tier (wave 1) delivers, and an Application
                  # stays Progressing while an issuer it owns is not Ready — so
                  # in the base tier it holds wave 0 open against a secret only a
                  # later wave can produce.
                - { path: "infra/helm/platform/public-tls" }
                  # The node-level collector, in a namespace of its own because it
                  # is the one platform workload needing hostPath and hostPorts
                  # (ADR-0200). Same tier as the backends it exports to.
                - { path: "infra/helm/platform/otel-agent" }
                - { path: "infra/helm/platform/ory" }
                  # The edge's RFC 9457 error bodies (ADR-0305). Beside ory
                  # because Oathkeeper is what raises most of the responses it
                  # rewrites, and every denial the edge issues makes a subrequest
                  # here.
                - { path: "infra/helm/platform/edge-errors" }
                  # The non-production mail sink Kratos's courier submits to
                  # (ADR-0307). Beside ory because it is only useful to it, and
                  # dropped by `mailpit.enabled: false` where a real relay exists.
                - { path: "infra/helm/platform/mailpit" }
                # Production mail (ADR-0307). Renders nothing unless the
                # environment enables it, which only production does.
                - { path: "infra/helm/platform/maddy" }
                - { path: "infra/helm/platform/temporal" }
                - { path: "infra/helm/platform/temporal-worker-controller" }
                - { path: "infra/helm/platform/openfga" }
  template:
    metadata:
      name: "{{ .env }}-platform-{{ .path.basename }}"
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/component: "{{ .path.basename }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/microservices-monorepo-template.git
        targetRevision: master
        path: "{{ .path.path }}"
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            # First, so anything below can still override it: the deletions of
            # upstream defaults that a wrapper chart's own values.yaml cannot
            # express (see the file's header).
            - "../../../gitops/platform/shared-values.yaml"
            # Generated: the repositories the platform's charts pull from, which
            # Kyverno's allow-list policy reads (ADR-0104).
            - "../../../gitops/platform/image-allowlist.yaml"
            - "../../../auth/kratos/values.yaml"
            - "../../../auth/oathkeeper/values.yaml"
            - "../../../gitops/platform/{{ .env }}/values.yaml"
          fileParameters:
            - name: 'kratos.kratos.identitySchemas.user\.v1\.json'
              path: "../../../auth/kratos/identity-schemas/user.v1.json"
            - name: oathkeeper.oathkeeper.accessRules
              path: "../../../auth/oathkeeper/access-rules.json"
            - name: seed.model
              path: "../../../auth/openfga/model.json"
            # The one copy of the platform's signing public key (ADR-0104). Empty
            # in the template, which renders no policy — see infra/auth/cosign.
            - name: policies.publicKey
              path: "../../../auth/cosign/cosign.pub"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
