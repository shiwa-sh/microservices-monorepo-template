# Services ApplicationSet (ADR-0201). Git-directory generator over per-env
# values files; one Application per service per environment, auto-onboarded
# when its values file lands in master.
#
# sync-wave "5" holds this back until the whole platform tier (base "0", data "2",
# core "3" — each gated by a custom ApplicationSet health check, see
# infra/helm/platform/argocd/values.yaml) and the gateway Application (wave "4")
# are all Synced+Healthy. Services depend on both: platform for
# Postgres/Temporal/OpenFGA/CoreDNS-affecting CNI stability, gateway for the
# Traefik middlewares their IngressRoutes reference.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: services
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A manual pause of auto-sync has to survive this ApplicationSet's own
  # reconcile. Without this, `spec.syncPolicy` is re-applied from the template
  # within seconds, auto-sync comes back, and self-heal reverts whatever
  # scripts/service-deploy.sh just installed — the deploy reports success and the
  # cluster keeps running the committed image. `cluster:add` is the whole
  # working-tree path (ADR-0600), so the field it pauses is the one field this set
  # must not own.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # Sync windows (e.g. staging's 05:00 UTC gate) live on the
                # per-env AppProject, not here — see bootstrap/appproject.yaml.
                - { env: dev,     server: "https://kubernetes.default.svc" }
                - { env: staging, server: "https://kubernetes.default.svc" }
                - { env: prod,    server: "https://kubernetes.default.svc" }
          - git:
              repoURL: https://github.com/tabmadi/microservices-monorepo-template.git
              revision: master
              files:
                - { path: "infra/gitops/services/{{ .env }}/values/*.yaml" }
  template:
    metadata:
      # `filenameNormalized` keeps the extension, so it produces
      # `dev-service-orders.yaml` — a resource whose name says which FILE generated
      # it rather than which service it deploys, against the `<env>-<tier>-
      # <component>` naming ADR-0201 fixes. Trimming it is the whole fix.
      name: '{{ .env }}-service-{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        env: "{{ .env }}"
        app.kubernetes.io/part-of: services
        app.kubernetes.io/component: "{{ .path.filenameNormalized }}"
    spec:
      project: "{{ .env }}"
      source:
        repoURL: https://github.com/tabmadi/microservices-monorepo-template.git
        targetRevision: master
        path: infra/helm/service
        helm:
          valueFiles:
            # Env-wide first, then the service's own, which therefore wins. What
            # belongs in the shared file is anything true of every service in the
            # environment — the registry's pull credential, for one. Repeating it
            # per service is how one of them ends up without it, and the symptom is
            # an ImagePullBackOff on the service nobody edited.
            - "../../gitops/services/{{ .env }}/shared.yaml"
            - "../../gitops/services/{{ .env }}/values/{{ .path.filename }}"
      destination: { server: "{{ .server }}", namespace: platform }
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
        # Retry on failure — automated+selfHeal won't re-run a sync that errored
        # on the same commit; without this a transient repo-server/network blip
        # parks the generated app until a manual sync. Caps at 2m (ADR-0201).
        retry:
          limit: 20
          backoff: { duration: 10s, maxDuration: 2m, factor: 2 }
