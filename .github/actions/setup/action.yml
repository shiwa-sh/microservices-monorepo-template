# Shared toolchain setup for every workflow: mise (with its tool cache) and,
# optionally, the Go build + module cache. Defined exactly once here.
#
# A composite action, not a reusable `workflow_call` workflow: a called workflow
# runs as its OWN job on its OWN runner, so it cannot install a toolchain that a
# later step in the calling job would see. Composite steps splice into the caller.
# Checkout stays in the caller — the runner needs the repo on disk before it can
# resolve `./.github/actions/setup` at all, and fetch-depth differs per workflow.
name: setup
description: Install the mise toolchain (and optionally the Go build cache).

inputs:
  go-cache:
    description: Restore and save the shared Go build + module cache.
    default: "false"

runs:
  using: composite
  steps:
    # mise reads every other pin in the repo, so an unpinned reader makes those
    # pins conditional on whatever release the action happened to fetch: a cold
    # runner can go red on a commit that changed nothing. Renovate's custom
    # manager in .github/renovate.json owns the bump, keyed on the marker comment.
    - uses: jdx/mise-action@v2
      # The token mise presents to api.github.com when it fetches a `github:` or
      # `ubi:` tool. It defaults to the one the FORGE minted for this workflow,
      # and on GitHub the forge and the API are the same host, so that works.
      # On Forgejo they are not: the token is valid, for somewhere else, and
      # GitHub answers `401 Bad credentials` — which reads as an expired secret
      # rather than as a token offered to the wrong host.
      #
      # `FORGEJO_ACTIONS` is the discriminator because it is what the runner
      # itself sets and GitHub never does. The obvious test — comparing
      # `github.server_url` — does not work: on a forge configured to resolve
      # actions from github.com, that context reports github.com too.
      #
      # There it falls back to `MISE_GITHUB_TOKEN` if the forge carries one, and
      # to unauthenticated requests if it does not. That limit is per IP and low,
      # so a self-hosted runner installing tools often wants a real GitHub token
      # in that secret; it reads public releases and needs no scopes.
      #
      # Both places, because they are two different channels: the runner puts the
      # forge's token in the step ENVIRONMENT, and the action passes its own input
      # to mise. Overriding one leaves the other.
      env:
        GITHUB_TOKEN: ${{ env.FORGEJO_ACTIONS && env.MISE_GITHUB_TOKEN || github.token }}
      with:
        github_token: ${{ env.FORGEJO_ACTIONS && env.MISE_GITHUB_TOKEN || github.token }}
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.8.5
        install: true
        cache: true

    # One key across test.yml and build.yml so they share a single cache entry
    # instead of each warming their own copy of the same compiled packages.
    - if: inputs.go-cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
