# Shared toolchain setup for every workflow: mise (with its tool cache) and,
# optionally, the Go build + module cache. Defined exactly once here.
#
# A composite action, not a reusable `workflow_call` workflow: a called workflow
# runs as its OWN job on its OWN runner, so it cannot install a toolchain that a
# later step in the calling job would see. Composite steps splice into the caller.
# Checkout stays in the caller — the runner needs the repo on disk before it can
# resolve `./.github/actions/setup` at all, and fetch-depth differs per workflow.
name: setup
description: Install the mise toolchain (and optionally the Go build cache).

inputs:
  go-cache:
    description: Restore and save the shared Go build + module cache.
    default: "false"

runs:
  using: composite
  steps:
    # mise reads every other pin in the repo, so an unpinned reader makes those
    # pins conditional on whatever release the action happened to fetch: a cold
    # runner can go red on a commit that changed nothing. Renovate's custom
    # manager in .github/renovate.json owns the bump, keyed on the marker comment.
    - uses: jdx/mise-action@v2
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.8.5
        # The TOOLS are installed by the next step but one, not here. Installing
        # them here would run before the correction below, and the correction is
        # about how tools are fetched — on Forgejo the install fails outright.
        install: false
        cache: true

    # Corrections a forge that is not GitHub needs, applied to the whole job.
    # This is the earliest step that can run them: they are a mise task, and mise
    # exists as of the step above.
    - shell: bash
      run: mise run ci:forge-env >> "$GITHUB_ENV"

    - shell: bash
      run: mise run ci:tools

    # One key across test.yml and build.yml so they share a single cache entry
    # instead of each warming their own copy of the same compiled packages.
    - if: inputs.go-cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
