# Tag-driven prod promotion (ADR-0201, ADR-0103). Triggered by a repo-wide CalVer
# release tag (vYYYY.0M.MICRO) cut by `mise run release`. A release pins EVERY
# prod service/app to the release commit — by digest, the strongest immutable
# identity — labels the images with the CalVer, opens the prod-bump PR, and (once
# merged + synced) gates on the rollout completing.
name: promote-on-release

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].*"]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  promote:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release
        id: rel
        run: mise run ci:release-info >> "$GITHUB_OUTPUT"

      - name: Pin prod to digests + label images with the CalVer
        env:
          SHA: ${{ steps.rel.outputs.sha }}
          VER: ${{ steps.rel.outputs.version }}
        run: mise run promote:prod

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deploy): promote ${{ steps.rel.outputs.version }} to prod"
          title: "chore(deploy): ${{ steps.rel.outputs.version }} → prod"
          branch: deploy/prod-${{ steps.rel.outputs.version }}
          delete-branch: true
          labels: auto-merge

      # Rollout gate (ADR-0201, ADR-0103): "Argo Healthy" already means the new
      # ReplicaSet is available, but a release must not report success until prod
      # has actually converged on the release commit. The task explains what it
      # needs to be armed and says so loudly when it is not.
      - name: Verify prod rollout
        env:
          SHA: ${{ steps.rel.outputs.sha }}
        run: mise run promote:verify

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.rel.outputs.version }}
          generate_release_notes: true
