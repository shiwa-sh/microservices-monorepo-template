# Build + push container images on every merge to master (ADR-0101, ADR-0201).
# Images are tagged <service>:<git-sha>. Promotion to env values files happens
# in promote-on-merge.yml (dev/staging) and promote-on-release.yml (prod).
name: publish

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

# WHERE IMAGES GO. `ghcr.io` and the forge's own repository path are the defaults,
# because a project generated from this template has a GitHub origin and no cluster
# yet (ADR-0102). A deployment that runs its own registry (ADR-0105) sets these as
# forge variables and this workflow re-targets without an edit — which is the same
# property the thin-YAML rule buys for the build logic.
env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || github.repository }}

jobs:
  affected:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
      apps: ${{ steps.affected.outputs.apps }}
      images: ${{ steps.affected.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - id: affected
        run: mise run ci:affected-matrix >> "$GITHUB_OUTPUT"

  images:
    needs: affected
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit {service, cmd} pairs from the affected job, not a cross product
        # of services and commands. Not every service owns a worker process, and a
        # cross product asks the builder for a `cmd/worker` directory that does not
        # exist — one red cell per workerless service, on every run, while every
        # image the workflow was meant to produce is published anyway.
        include: ${{ fromJSON(needs.affected.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain, for the signing step: cosign, syft, sops and yq are pinned
      # in .mise.toml like everything else (ADR-0101), so CI signs with the same
      # binaries a developer verifies with.
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          # The forge's own token works for the forge's own registry, which is the
          # default. A registry that is a separate component — zot — has its own
          # push identity (ADR-0105), and these two secrets are where it goes.
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Build & push ${{ matrix.service }}-${{ matrix.cmd }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          # Bake the build identity (ADR-0103): the commit SHA the pod will
          # self-report via /version and the X-App-Version header. BUILD_VERSION
          # stays "dev" for master builds; prod's CalVer is stamped on release.
          build-args: |
            APP_CMD=${{ matrix.cmd }}
            GIT_SHA=${{ github.sha }}
            BUILD_VERSION=dev
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}-${{ matrix.cmd }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # By DIGEST, not by the tag just pushed: cosign resolves a tag itself, and a
      # tag resolved twice is a tag that can move in between (ADR-0104).
      - name: Sign, SBOM, provenance
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
          # The supply-chain record is filed by ci:sign itself, at the line where
          # the signature and both attestations exist — see the script for why it is
          # not a separate step. Unset until a project has a Loki to push to; the
          # build stays signed either way.
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_PUSH_AUTH: ${{ secrets.LOKI_PUSH_AUTH }}
          LOKI_PUSH_TENANT: ${{ vars.LOKI_PUSH_TENANT }}
        run: mise run ci:sign -- "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.service }}-${{ matrix.cmd }}@${{ steps.build.outputs.digest }}"

  # Apps are single images (no server/worker split), so they get their own matrix
  # rather than joining the Go-service one — but both are driven by the same
  # ci:affected manifest. Each app ships its own Dockerfile; the build context
  # differs per app (the frontend builds from the repo root, scoped by its
  # Dockerfile.dockerignore; the admin from apps/admin, since the root
  # .dockerignore excludes apps/), so it is resolved per app below. The build SHA
  # is baked as SERVICE_VERSION (ADR-0103).
  apps:
    needs: affected
    if: ${{ needs.affected.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain, for the signing step: cosign, syft, sops and yq are pinned
      # in .mise.toml like everything else (ADR-0101), so CI signs with the same
      # binaries a developer verifies with.
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          # The forge's own token works for the forge's own registry, which is the
          # default. A registry that is a separate component — zot — has its own
          # push identity (ADR-0105), and these two secrets are where it goes.
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - id: ctx
        run: mise run ci:build-context -- "${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - name: Build & push ${{ matrix.app }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: SERVICE_VERSION=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign, SBOM, provenance
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_CI }}
          # The supply-chain record is filed by ci:sign itself, at the line where
          # the signature and both attestations exist — see the script for why it is
          # not a separate step. Unset until a project has a Loki to push to; the
          # build stays signed either way.
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_PUSH_AUTH: ${{ secrets.LOKI_PUSH_AUTH }}
          LOKI_PUSH_TENANT: ${{ vars.LOKI_PUSH_TENANT }}
        run: mise run ci:sign -- "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ matrix.app }}@${{ steps.build.outputs.digest }}"
