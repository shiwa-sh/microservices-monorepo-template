[env]
# The registered local port for this service (scripts/lib/ports.sh). Committed
# rather than left to .env so that a sibling's CATALOG_URL/PAYMENT_URL default can
# rely on it, and so two services can never quietly pick the same port. In-cluster
# is unaffected — the chart sets no PORT, so pods still bind :8080.
PORT = "8082"
_.file = ".env"

[tasks.env]
# Seed .env from .env.example on a fresh clone (see scripts/env-ensure.sh for why
# it stops rather than continuing). Hidden: it runs as a dependency.
hide = true
run = "bash ../../scripts/env-ensure.sh"

[tasks.server]
# Dependency components this service needs in the cluster (ADR-0016, ADR-0030).
# Declared here, with the service, because the service knows its own dependencies
# and a named profile never can. mise resolves the graph: the shared cluster:base
# edge is deduped, independent components come up in parallel, and each one
# fast-exits when already Ready.
depends = ["env", "dep:postgres", "dep:openfga", "dep:temporal"]
run = "go run ./cmd/server"

[tasks.worker]
# svc:* are the OTHER SERVICES this one calls, declared for the same reason dep:*
# are: the checkout saga's activities dial catalog and payment (ADR-0006), so a
# worker without them starts cleanly and dies on the first checkout. Each is made
# to answer on its registered local port, which CATALOG_URL/PAYMENT_URL default to.
# Only the worker needs them — the server has no cross-service calls.
depends = [
  "env",
  "dep:postgres",
  "dep:openfga",
  "dep:temporal",
  "svc:catalog",
  "svc:payment",
]
run = "go run ./cmd/worker"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.migrate]
depends = ["env", "dep:postgres"]
run = "dbmate --no-dump-schema up"

[tasks.generate]
run = "sqlc generate && bash ../../scripts/gen-openapi.sh"

[tasks.build]
run = "go build ./..."
