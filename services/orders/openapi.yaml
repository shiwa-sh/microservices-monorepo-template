openapi: 3.1.0
info: { title: orders, version: 0.1.0, description: Order checkout and saga orchestration service., x-audience: public }
servers: [{ url: /api }]   # flat resource namespace (ADR-0306); paths are globally unique
# `x-admin: crud` marks the resource group the admin generator (ADR-0401, tools/admin-gen)
# scaffolds pages for. Orders are saga-created and immutable, so the surface is
# list/detail (read) plus the `cancel` action below — no edit/delete.
tags: [{ name: orders, x-admin: crud }]
paths:
  /orders:
    get:
      operationId: listOrders
      # Listing every order is a back-office view, kept out of public docs (ADR-0303).
      x-audience: internal
      description: List all orders.
      tags: [orders]
      responses:
        "200":
          description: The order list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
                # Served verbatim by the API mock (ADR-0600). The statuses vary on
                # purpose: a list example with one status is how a UI ships with an
                # unstyled badge for every other one.
                example:
                  - { id: order_01kztnj6c8e0jt7vzw0cn1wxvd, product_id: product_01kztmx9e0fq1r13w5d1aerqw6, quantity: 2, total_cents: 259800, status: confirmed }
                  - { id: order_01kztnpc5gfx2a9kkhxe1h4ar3, product_id: product_01kztn1f78evjtsk2gbgjk5hs3, quantity: 1, total_cents: 89900, status: pending }
                  - { id: order_01kztnthyrfsj8a9pjx1md2pqs, product_id: product_01kztn5n0gfphac1fsep3b64nj, quantity: 4, total_cents: 59600, status: cancelled }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: checkout
      tags: [orders]
      description: |
        Starts the Checkout Temporal saga (ADR-0302). Idempotent on the
        Idempotency-Key header: a retry of the same request returns the order the
        first one created rather than placing a second.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, description: Client-generated key that makes the checkout idempotent., schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        description: The checkout to start.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      description: Fetch an order by id.
      tags: [orders]
      parameters: [{ name: id, in: path, required: true, description: Order id., schema: { $ref: "#/components/schemas/OrderId" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        default: { $ref: "#/components/responses/Error" }
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      # Operator action (ADR-0401): admin-gen emits an action button, not CRUD.
      # Edge-reachable first-party, out of public docs (ADR-0303 audience ladder).
      x-admin: action
      x-audience: internal
      description: Cancel an order. Starts the CancelOrder workflow (ADR-0302).
      tags: [orders]
      parameters: [{ name: id, in: path, required: true, description: Id of the order to cancel., schema: { $ref: "#/components/schemas/OrderId" } }]
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    # >>> shared-components: responses — generated from tools/codegen/shared-components.yaml, do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    # <<< shared-components
  schemas:
    # >>> shared-components: schemas — generated from tools/codegen/shared-components.yaml, do not edit
    # RFC 9457 problem details. `instance` is deliberately absent: `trace_id`
    # identifies the occurrence, and it reaches the trace where an instance URL
    # reaches nothing.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Served as `application/problem+json` by services and
        by the edge alike, so a generated client has one error branch rather than two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case takes a `urn:problem-type:<service>:<slug>`
            URN — never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. Does not vary with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, duplicated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Instance-specific and safe to show a user. Never a stack trace, a query, or
            an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so a user-reported
            error reaches its trace. Supplied from the active span, not by the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, populated from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the offending member.
                example: /price_cents
              message:
                type: string
                example: must be greater than or equal to 0
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # <<< shared-components
    # Wire identifiers (ADR-0003). The stored columns stay bare `uuid`; this form
    # exists so a value in a log line, a ticket, or a URL says what it is.
    OrderId:
      type: string
      description: |
        An order identifier: `order_` and the UUIDv7 in 26 characters of Crockford
        base32. The leading character is capped at 7 — 26 characters hold 130 bits and
        a UUID is 128. Opaque to a consumer: nothing parses, orders, or constructs one.
      pattern: '^order_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: order_01kztnj6c8e0jt7vzw0cn1wxvd
    # Minted by catalog and carried here, so the prefix names the owning service's
    # resource rather than this one's.
    ProductId:
      type: string
      description: |
        A product identifier: `product_` and the UUIDv7 in 26 characters of Crockford
        base32. Opaque to a consumer: nothing parses, orders, or constructs one.
      pattern: '^product_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: product_01kztmx9e0fq1r13w5d1aerqw6
    WorkflowHandle:
      type: object
      description: Handle to an async Temporal workflow run.
      required: [id, run_id, status]
      properties:
        id:     { type: string }
        run_id: { type: string }
        status: { type: string, enum: [running, completed, failed, cancelled] }
        # uri-reference, not uri: the value is a path on this same origin
        # (`/api/orders/<id>`), and `format: uri` means an absolute URI — the
        # committed example fails its own schema under a validator that checks
        # formats, which is how the API mock found this.
        result_url: { type: string, format: uri-reference, description: "GET to fetch terminal status + result" }
      # `running` is the honest example: it is what the real 202 returns. Against the
      # API mock the poll never progresses (ADR-0600) — workflow progression is
      # exercised against real services, so build the pending state and stop there.
      example: { id: checkout-order_01kztnj6c8e0jt7vzw0cn1wxvd, run_id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0e001, status: running, result_url: /api/orders/order_01kztnj6c8e0jt7vzw0cn1wxvd }
    CheckoutInput:
      type: object
      description: Request body to start a checkout.
      required: [product_id, quantity]
      properties:
        product_id: { $ref: "#/components/schemas/ProductId" }
        quantity:   { type: integer, minimum: 1 }
    Order:
      type: object
      description: A customer order.
      required: [id, product_id, quantity, total_cents, status]
      properties:
        id:          { $ref: "#/components/schemas/OrderId" }
        product_id:  { $ref: "#/components/schemas/ProductId" }
        quantity:    { type: integer }
        total_cents: { type: integer }
        status:      { type: string, enum: [pending, confirmed, failed, cancelled] }
      example: { id: order_01kztnj6c8e0jt7vzw0cn1wxvd, product_id: product_01kztmx9e0fq1r13w5d1aerqw6, quantity: 2, total_cents: 259800, status: confirmed }
