openapi: 3.1.0
info: { title: authz, version: 0.1.0, description: Ops-tier edge authorizer and operator admin (ADR-0304/0012/0017)., x-audience: cluster }
servers: [{ url: / }]   # east-west control-plane service; no /api edge route (ADR-0305)
tags: [{ name: authorize }, { name: operators }, { name: identities, x-admin: crud }]
paths:
  /authorize:
    post:
      operationId: authorize
      # Ops-tier decision for Oathkeeper's remote_json authorizer: 200 = allow,
      # 403 = deny. The request shape mirrors the remote_json payload in
      # infra/auth/oathkeeper/access-rules.json (that config remains the caller's
      # contract; this spec is authz's own view of the same shape).
      description: Ops-tier authorization decision for Oathkeeper's remote_json authorizer.
      tags: [authorize]
      requestBody:
        required: true
        description: The decision request forwarded by Oathkeeper.
        content: { application/json: { schema: { $ref: "#/components/schemas/AuthorizeRequest" } } }
      responses:
        "200": { description: Allowed. }
        "403":
          description: Denied.
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
        default: { $ref: "#/components/responses/Error" }
  /identities:
    get:
      operationId: listIdentities
      # Changelist target (ADR-0401): the console's Users page. The list is served from
      # Kratos admin (GET /admin/identities), which only authz may reach
      # (network-policies/30-ory.yaml) — the console fetches it through here, never
      # directly. Adding a create op here would scaffold an "add user" page; we don't
      # want that (operator creation stays the dedicated createOperator action), so the
      # tag exposes list + get + update only → admin-gen emits a changelist + an edit
      # page, no add page.
      description: List identities (product users and operators) from Kratos, paginated.
      tags: [identities]
      # per_page caps the Kratos admin page (page_size); the generated changelist
      # paginates client-side in the grid within that window. No page offset: this
      # Kratos uses keyset pagination where `page` is an opaque page-token, not a
      # 1-based number, so forwarding a numeric page returns an empty set. For counts
      # beyond one page, raise per_page (or wire the grid to keyset page_token).
      parameters:
        - { name: per_page, in: query, required: false, description: Page size., schema: { type: integer, minimum: 1, maximum: 1000, default: 250 } }
      responses:
        "200":
          description: The identities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Identity" }
                # An unconstrained array generates an empty list, which is the one
                # answer a changelist cannot be built against (ADR-0600).
                example:
                  - { id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0b001, email: operator@e2e.localtest.me, name: Test Operator, operator: true }
                  - { id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0b002, email: user@e2e.localtest.me, name: Test User, operator: false }
        default: { $ref: "#/components/responses/Error" }
  /identities/{id}:
    get:
      operationId: getIdentity
      # Prefills the console's edit form (admin-gen loads GET /{id} on mount).
      description: Fetch one identity by id.
      tags: [identities]
      parameters:
        - { name: id, in: path, required: true, description: The id of the identity to fetch., schema: { type: string } }
      responses:
        "200": { description: The identity., content: { application/json: { schema: { $ref: "#/components/schemas/Identity" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateIdentity
      # Edit target (ADR-0401): the console's per-row change page. Updates the editable
      # traits only; email is the login identifier and is intentionally not editable.
      description: Update an identity's editable traits.
      tags: [identities]
      parameters:
        - { name: id, in: path, required: true, description: The id of the identity to update., schema: { type: string } }
      requestBody:
        required: true
        description: The traits to change.
        content: { application/json: { schema: { $ref: "#/components/schemas/IdentityUpdate" } } }
      responses:
        "200": { description: The updated identity., content: { application/json: { schema: { $ref: "#/components/schemas/Identity" } } } }
        default: { $ref: "#/components/responses/Error" }
  /authorize/relation:
    post:
      operationId: checkRelation
      # East-west only, and that is the decision rather than an oversight: this
      # answers "may this subject do this to this object" for a first-party caller
      # that has already established who the subject is. Exposing it at the edge
      # would let a client ask about a subject that is not itself.
      #
      # It exists because a Checker is a Go library (libs/go/authz) and the
      # frontend is not Go. ADR-0700's analytics panel must perform an
      # AUTHORITATIVE check in the render layer rather than trust that a session
      # exists, and this is how a non-Go caller reaches the same decision the
      # services make.
      x-audience: cluster
      description: Check one relation for one subject against one object.
      tags: [authorize]
      requestBody:
        required: true
        description: The relation to check.
        content: { application/json: { schema: { $ref: "#/components/schemas/RelationCheck" } } }
      responses:
        "200":
          description: The decision. A deny is an answer, not an error.
          content: { application/json: { schema: { $ref: "#/components/schemas/RelationDecision" } } }
        default: { $ref: "#/components/responses/Error" }
  /operators:
    post:
      operationId: createOperator
      # Generated admin page target (ADR-0401): a control-plane action, not CRUD.
      x-admin: action
      description: Create an operator identity and grant the operator role.
      tags: [operators]
      requestBody:
        required: true
        description: The operator to create.
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorInput" } } }
      responses:
        # 202 and a handle, not 200 and the operator. Creating one is a dual write —
        # a Kratos identity and an OpenFGA grant — and ADR-0304 puts an
        # authz-relevant pair in a workflow, so the identity does not exist yet when
        # this returns. Every other authz-relevant mutation on this platform answers
        # the same way (orders, payment).
        "202":
          description: The operator registration was accepted and is running.
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowHandle" } } }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    # >>> shared-components: responses — generated from tools/codegen/shared-components.yaml, do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    # <<< shared-components
  schemas:
    # >>> shared-components: schemas — generated from tools/codegen/shared-components.yaml, do not edit
    # RFC 9457 problem details. `instance` is deliberately absent: `trace_id`
    # identifies the occurrence, and it reaches the trace where an instance URL
    # reaches nothing.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Served as `application/problem+json` by services and
        by the edge alike, so a generated client has one error branch rather than two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case takes a `urn:problem-type:<service>:<slug>`
            URN — never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. Does not vary with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, duplicated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Instance-specific and safe to show a user. Never a stack trace, a query, or
            an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so a user-reported
            error reaches its trace. Supplied from the active span, not by the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, populated from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the offending member.
                example: /price/amount
              message:
                type: string
                example: must be a decimal amount
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # <<< shared-components
    AuthorizeRequest:
      type: object
      description: The remote_json payload Oathkeeper POSTs per ops-dashboard request.
      required: [subject, tool, aal, operator]
      properties:
        subject:  { type: string, description: Kratos identity id; empty for anonymous. }
        tool:     { type: string, description: Ops dashboard slug such as grafana or hubble. }
        aal:      { type: string, description: authenticator_assurance_level from the session. }
        operator: { type: string, description: The operator identity trait; "true" when set. }
    RelationCheck:
      type: object
      description: A single OpenFGA relation question, in the model's own vocabulary.
      required: [subject, relation, object]
      properties:
        subject:
          type: string
          minLength: 1
          description: "The subject, prefixed by its type — `user:<identity-id>`."
        relation: { type: string, minLength: 1, description: The relation to test, such as `view`. }
        object:
          type: string
          minLength: 1
          description: "The object, prefixed by its type — `analytics_panel:funnels`."
    RelationDecision:
      type: object
      description: The answer to one relation check.
      required: [allowed]
      properties:
        allowed: { type: boolean }
      example: { allowed: true }
    OperatorInput:
      type: object
      description: Request body to create an operator.
      required: [email, password]
      properties:
        email:    { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    WorkflowHandle:
      type: object
      description: Handle to an async Temporal workflow run.
      required: [id, run_id, status]
      properties:
        id:     { type: string }
        run_id: { type: string }
        status: { type: string, enum: [running, completed, failed, cancelled] }
      example: { id: register-operator-ops-example.com, run_id: 01kztn9tsrea7b1597q3yjdeav, status: running }
    Identity:
      type: object
      description: A Kratos identity, flattened from its traits for the admin changelist.
      required: [id, email]
      properties:
        id:       { type: string }
        email:    { type: string }
        name:     { type: string }
        operator: { type: boolean }
      example: { id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0b002, email: user@e2e.localtest.me, name: Test User, operator: false }
    IdentityUpdate:
      type: object
      description: The editable traits of an identity. Email is the login identifier and is not editable here.
      properties:
        name:     { type: string }
        operator: { type: boolean }
