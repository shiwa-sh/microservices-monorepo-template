openapi: 3.1.0
info: { title: payment, version: 0.1.0, description: Payment charge and settlement service., x-audience: public }
servers: [{ url: /api }]   # flat resource namespace (ADR-0306); paths are globally unique
# `x-admin: crud` marks the resource group the admin generator (ADR-0401, tools/admin-gen)
# scaffolds pages for. Charges are workflow-created and immutable, so the surface
# is list/detail (read) plus the `refund` action below — no edit/delete.
tags: [{ name: charges, x-admin: crud }]
paths:
  /charges:
    get:
      operationId: listCharges
      # Listing every charge is a back-office view, kept out of public docs (ADR-0303).
      x-audience: internal
      description: List all charges.
      tags: [charges]
      responses:
        "200":
          description: The charge list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Charge" }
                # Served verbatim by the API mock (ADR-0600); the statuses vary so the
                # UI has to render every one of them.
                example:
                  - { id: charge_01kztnyqr0f13shqqnx8028xx5, order_id: order_01kztnj6c8e0jt7vzw0cn1wxvd, amount_cents: 259800, status: settled }
                  - { id: charge_01kztp2xh8e6nr9gh2xr7ryye5, order_id: order_01kztnpc5gfx2a9kkhxe1h4ar3, amount_cents: 89900, status: pending }
                  - { id: charge_01kztp73agejgvn558snqmna6f, order_id: order_01kztnthyrfsj8a9pjx1md2pqs, amount_cents: 59600, status: refunded }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCharge
      tags: [charges]
      description: |
        Starts the Charge Temporal workflow. Idempotent on Idempotency-Key header.
        Returns a workflow handle (ADR-0302).
      parameters:
        - { name: Idempotency-Key, in: header, required: true, description: Client-generated key that makes the charge request idempotent., schema: { type: string } }
      requestBody:
        required: true
        description: The charge to create.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeInput" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
  /charges/{id}:
    get:
      operationId: getCharge
      description: Fetch a charge by id.
      tags: [charges]
      parameters: [{ name: id, in: path, required: true, description: Charge id., schema: { $ref: "#/components/schemas/ChargeId" } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Charge" } } } }
        default: { $ref: "#/components/responses/Error" }
  /charges/{id}/refund:
    post:
      operationId: refundCharge
      # Operator action (ADR-0401): the future admin-gen emits this as an action
      # button/form, not a CRUD page (`x-admin: action`). Edge-reachable first-party
      # but kept out of the public docs (`internal`, ADR-0303 audience ladder) —
      # refunding is an operator action, not a public self-serve op.
      x-admin: action
      x-audience: internal
      description: Refund a settled charge. Starts the Refund workflow (ADR-0302).
      tags: [charges]
      parameters: [{ name: id, in: path, required: true, description: Id of the charge to refund., schema: { $ref: "#/components/schemas/ChargeId" } }]
      requestBody:
        required: true
        description: The refund request.
        content: { application/json: { schema: { $ref: "#/components/schemas/RefundInput" } } }
      responses:
        "202":
          description: Refund accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    # >>> shared-components: responses — generated from tools/codegen/shared-components.yaml, do not edit
    Error:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    # <<< shared-components
  schemas:
    # >>> shared-components: schemas — generated from tools/codegen/shared-components.yaml, do not edit
    # RFC 9457 problem details. `instance` is deliberately absent: `trace_id`
    # identifies the occurrence, and it reaches the trace where an instance URL
    # reaches nothing.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. Served as `application/problem+json` by services and
        by the edge alike, so a generated client has one error branch rather than two.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: |
            `about:blank`, except where two errors share a status code and a client
            handles them differently. That case takes a `urn:problem-type:<service>:<slug>`
            URN — never a dereferenceable URL, which would put an error taxonomy into
            the flat public URL namespace.
          default: "about:blank"
          example: "about:blank"
        title:
          type: string
          description: A stable, human-readable summary. Does not vary with the instance.
          example: Not Found
        status:
          type: integer
          description: The HTTP status, duplicated in the body.
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
          description: |
            Instance-specific and safe to show a user. Never a stack trace, a query, or
            an internal hostname.
          example: No product with that identifier.
        trace_id:
          type: string
          description: |
            The W3C Trace Context trace-id of the failing request, so a user-reported
            error reaches its trace. Supplied from the active span, not by the handler.
          pattern: "^[0-9a-f]{32}$"
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        errors:
          type: array
          description: |
            Field-level validation failures, populated from the generated validator.
            Absent when the failure is not a validation failure.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: RFC 6901 JSON Pointer to the offending member.
                example: /price_cents
              message:
                type: string
                example: must be greater than or equal to 0
      example:
        type: "about:blank"
        title: Not Found
        status: 404
        detail: No product with that identifier.
        trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    # <<< shared-components
    # Wire identifiers (ADR-0003). The stored columns stay bare `uuid`; this form
    # exists so a value in a log line, a ticket, or a URL says what it is.
    ChargeId:
      type: string
      description: |
        A charge identifier: `charge_` and the UUIDv7 in 26 characters of Crockford
        base32. The leading character is capped at 7 — 26 characters hold 130 bits and
        a UUID is 128. Opaque to a consumer: nothing parses, orders, or constructs one.
      pattern: '^charge_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: charge_01kztnyqr0f13shqqnx8028xx5
    # Minted by orders and carried here, so the prefix names the owning service's
    # resource rather than this one's.
    OrderId:
      type: string
      description: |
        An order identifier: `order_` and the UUIDv7 in 26 characters of Crockford
        base32. Opaque to a consumer: nothing parses, orders, or constructs one.
      pattern: '^order_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$'
      example: order_01kztnj6c8e0jt7vzw0cn1wxvd
    WorkflowHandle:
      type: object
      description: Handle to an async Temporal workflow run.
      required: [id, run_id, status]
      properties:
        id:     { type: string }
        run_id: { type: string }
        status: { type: string, enum: [running, completed, failed, cancelled] }
        result_url: { type: string, format: uri, description: "GET to fetch terminal status + result" }
      # See orders: `running` is what the real 202 returns, and the mock's poll never
      # progresses past it (ADR-0600).
      example: { id: charge-charge_01kztnyqr0f13shqqnx8028xx5, run_id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0e002, status: running, result_url: /api/charges/charge_01kztnyqr0f13shqqnx8028xx5 }
    ChargeInput:
      type: object
      description: Request body to create a charge.
      required: [order_id, amount_cents]
      properties:
        order_id:     { $ref: "#/components/schemas/OrderId" }
        amount_cents: { type: integer, minimum: 1 }
    RefundInput:
      type: object
      description: Request body to refund a charge.
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    Charge:
      type: object
      description: A payment charge against an order.
      required: [id, order_id, amount_cents, status]
      properties:
        id:           { $ref: "#/components/schemas/ChargeId" }
        order_id:     { $ref: "#/components/schemas/OrderId" }
        amount_cents: { type: integer }
        status:       { type: string, enum: [pending, settled, failed, refunded] }
      example: { id: charge_01kztnyqr0f13shqqnx8028xx5, order_id: order_01kztnj6c8e0jt7vzw0cn1wxvd, amount_cents: 259800, status: settled }
